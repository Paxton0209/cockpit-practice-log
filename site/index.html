<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashnote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Neutral only. Structure and proportion carry the page. No negative tracking. */
:root,[data-theme=light]{
  --bg:#f7f7f7;--stage:#f2f2f2;--panel:#fff;--ink:#0a0a0a;--t2:#5c5c5c;--t3:#9a9a9a;--line:rgba(0,0,0,.075);--fill:#efefef;--lift:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.06);--lift2:0 12px 32px -14px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.08);--accent:#0a7cff;
  --sbg:#f3f3f3;--ssf:#fff;--ssf2:#e6e6e6;--stx:#0a0a0a;--st2:#8a8a8a;--sln:#e8e8e8;--sac:#0a7cff;color-scheme:light}
[data-theme=dark]{
  --bg:#0a0a0a;--stage:#121212;--panel:#161616;--ink:#f5f5f5;--t2:#a3a3a3;--t3:#666;--line:rgba(255,255,255,.08);--fill:#222;--lift:0 0 0 1px rgba(255,255,255,.07);--lift2:0 0 0 1px rgba(255,255,255,.12),0 16px 40px -16px rgba(0,0,0,.7);--accent:#2b8fff;
  --sbg:#0b0b0b;--ssf:#191919;--ssf2:#2a2a2a;--stx:#f5f5f5;--st2:#8a8a8a;--sln:#262626;--sac:#2b8fff;color-scheme:dark}
:root{--font:Inter,-apple-system,BlinkMacSystemFont,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--out:cubic-bezier(.22,1,.36,1);--ease:cubic-bezier(.2,0,0,1);--io:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:400 15px/24px var(--font);color:var(--ink);background:var(--bg);letter-spacing:normal;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button{font:inherit;color:inherit;letter-spacing:normal;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0;font-weight:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.num{font-variant-numeric:tabular-nums}
.lbl13{font-size:13px;line-height:20px;color:var(--t3)}
.press{transition:transform .12s var(--ease),opacity .15s}.press:active{transform:scale(.97)}
.arrow{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--ink)}
.arrow i{transition:transform .35s var(--out);font-style:normal}.arrow:hover i{transform:translateX(3px)}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--t2);transition:color .15s,background-color .15s}
.ib:hover{color:var(--ink);background:var(--fill)}

/* header */
header{position:sticky;top:0;z-index:30;height:64px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 -1px 0 transparent;transition:box-shadow .25s}
header.sc{box-shadow:inset 0 -1px 0 var(--line)}
.hd{height:100%;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.mark{width:20px;height:20px;border-radius:5px;background:var(--ink);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;top:0;bottom:0;left:38.2%;width:2px;background:var(--bg);transition:left .7s var(--out)}
.brand:hover .mark::after{left:61.8%}
.sp{flex:1}

/* reveal */
[data-r]{opacity:0;transform:translateY(12px);transition:opacity .8s var(--ease),transform 1s var(--out);transition-delay:var(--d,0ms)}
[data-r].in{opacity:1;transform:none}




/* progress */
.chap2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 24px}
.chap2 .c{display:flex;flex-direction:column;gap:10px}
.chap2 .tk{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.chap2 .tk i{height:24px;border-radius:3px;background:var(--fill);transition:transform .3s var(--out)}
.chap2 .tk i.done{background:var(--ink);cursor:pointer}
.chap2 .tk i.next{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink);animation:pulse 1.8s var(--io) infinite}
@keyframes pulse{50%{opacity:.3}}
.chap2 .tk i:hover{transform:scaleY(1.25)}
.chap2 .nm{font-size:13px;line-height:20px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap2 .c.cur .nm{color:var(--ink)}
.tip{position:fixed;z-index:50;pointer-events:none;padding:5px 9px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;line-height:16px;opacity:0;transform:translate(-50%,-6px);transition:opacity .15s;white-space:nowrap}
.tip.on{opacity:1}

/* entries */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 24px}
.card{display:flex;flex-direction:column;gap:16px;transition:opacity .35s var(--ease)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--lift)}
.thumb .scr{position:absolute;left:10%;right:10%;top:50%;transform:translateY(-50%);border-radius:8px;overflow:hidden;transition:transform .6s var(--out)}
.card:hover .thumb .scr{transform:translateY(-50%) scale(1.02)}
.thumb .after{position:absolute;inset:0;clip-path:inset(0 100% 0 0)}
.thumb .lb{position:absolute;left:12px;top:10px;font-size:12px;color:var(--t3);transition:opacity .3s}
.thumb .lb.a{opacity:0}
.thumb .cur{position:absolute;left:0;top:0;z-index:2;width:14px;height:14px;opacity:0;pointer-events:none}
.thumb .cur svg{position:absolute;left:0;top:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.thumb .cur b{position:absolute;left:12px;top:12px;height:16px;padding:0 5px;border-radius:4px;background:var(--accent);color:#fff;font-size:10px;line-height:16px;font-weight:500;white-space:nowrap}
.card.play .thumb .after{animation:wipe 6.4s var(--io) infinite;animation-delay:var(--ld,0s)}
.card.play .thumb .cur{animation:curmove 6.4s var(--io) infinite;animation-delay:var(--ld,0s)}
.card.play .thumb .lb.b{animation:lb 6.4s linear infinite;animation-delay:var(--ld,0s)}
.card.play .thumb .lb.a{animation:la 6.4s linear infinite;animation-delay:var(--ld,0s)}
@keyframes wipe{0%,22%{clip-path:inset(0 100% 0 0)}48%,78%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes curmove{0%{opacity:0;left:16%;top:66%}12%{opacity:1;left:16%;top:64%}22%{left:20%;top:60%}48%{left:84%;top:56%}70%{opacity:1;left:84%;top:56%}80%,100%{opacity:0;left:88%;top:70%}}
@keyframes lb{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}
@keyframes la{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
.card:hover .thumb .after{animation:none;clip-path:inset(0 0 0 0);transition:clip-path .7s var(--out)}
.card:hover .thumb .cur{animation:none;opacity:0}
.card:hover .thumb .lb.b{animation:none;opacity:0}.card:hover .thumb .lb.a{animation:none;opacity:1}
.meta{display:flex;align-items:baseline;gap:10px;min-height:24px;padding:0 2px}
.meta b{font:400 12px/24px var(--mono);color:var(--t3)}
.meta .ttl{font-size:15px;font-weight:500;line-height:24px}
.meta .ct{font-size:13px;color:var(--t3)}
.card.soon{pointer-events:none}
.card.soon .thumb{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.card.soon .ttl{color:var(--t3);font-weight:400}
.card .thumb{transition:box-shadow .35s var(--ease),transform .6s var(--out)}.card:not(.soon):hover .thumb{box-shadow:var(--lift2);transform:translateY(-2px)}
.card:active .thumb{transform:scale(.99)}
footer{margin-top:160px;padding:20px 0 48px;display:flex;justify-content:space-between;font-size:13px;color:var(--t3);box-shadow:inset 0 1px 0 var(--line)}

/* screens: drawn at real pixels, scaled to fit */
.cs{position:relative;width:100%;overflow:hidden;background:var(--sbg);border-radius:inherit}
.px{position:absolute;left:0;top:0;width:1920px;height:720px;transform-origin:0 0;transform:scale(var(--k,.25));font-family:var(--font);color:var(--stx);background:var(--sbg);letter-spacing:normal;line-height:1.3}
.px h3,.px h4{margin:0;font-weight:600}
/* T · turn-by-turn · after */
.px.tb{width:1200px;height:560px;display:grid;grid-template-rows:62fr 38fr;background:var(--ssf)}
.tb .top{display:flex;align-items:center;gap:56px;padding:0 80px}
.tb .d{font-size:calc(var(--dz,150)*1px);line-height:1;font-weight:600;font-variant-numeric:tabular-nums;transition:font-size .2s}
.tb .d small{font-size:.66em;font-weight:500;color:var(--st2);margin-left:14px}
.tb .s{margin-top:16px;font-size:calc(var(--st,76)*1px);line-height:1.1;font-weight:500;transition:font-size .2s}
.tb .bot{background:var(--sbg);display:flex;align-items:center;justify-content:space-between;padding:0 80px;font-size:60px;font-weight:500;color:var(--st2)}
.tb .bot span{display:flex;align-items:center;gap:20px}.tb .bot b{font-weight:500;color:var(--stx)}
/* T · before (phone-style nav card) */
.px.tbb{width:1200px;height:560px;background:var(--ssf);font-size:18px}
.tbb .bar{height:180px;background:#1f6feb;color:#fff;display:flex;align-items:center;gap:22px;padding:0 32px}
.tbb .bar .t b{display:block;font-size:40px;line-height:48px;font-weight:700}.tbb .bar .t span{font-size:26px;line-height:32px;opacity:.92}
.tbb .lim{margin-left:auto;width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 7px #e53935;color:#111;display:grid;place-items:center;font-size:28px;font-weight:700}
.tbb .lanes{height:56px;background:#1857c2;display:flex;gap:18px;align-items:center;padding:0 32px;color:rgba(255,255,255,.45)}.tbb .lanes .on{color:#fff}
.tbb .body{padding:24px 32px;display:flex;flex-direction:column;gap:18px}
.tbb .chip{align-self:flex-start;height:40px;padding:0 16px;border-radius:20px;background:var(--ssf2);display:flex;align-items:center;gap:8px;font-size:18px}
.tbb .eta{display:flex;align-items:baseline;gap:14px}.tbb .eta b{font-size:30px;color:#1a8f3c}.tbb .eta span{font-size:20px;color:var(--st2)}
.tbb .btns{position:absolute;left:0;right:0;bottom:0;height:88px;display:flex;gap:12px;align-items:center;padding:0 32px;box-shadow:inset 0 1px 0 var(--sln)}
.tbb .btns span{height:44px;padding:0 20px;border-radius:22px;background:var(--ssf2);display:flex;align-items:center;font-size:17px;font-weight:500}
.tbb .btns span.end{margin-left:auto;background:#e53935;color:#fff}
/* A · settings · after */
.px.sa{display:grid;grid-template-columns:733px 1fr}
.sa aside{padding:48px 32px 48px 48px;display:flex;flex-direction:column;gap:8px}
.sa h3{margin:0 0 20px 20px;font-size:40px;line-height:56px}
.sa .nv{height:calc(var(--rh,76)*1px);display:flex;align-items:center;gap:20px;padding:0 20px;border-radius:16px;font-size:calc(var(--ts,28)*1px);color:var(--st2);transition:height .25s var(--out)}
.sa .nv.on{background:var(--ssf);color:var(--stx)}
.sa section{background:var(--ssf);padding:48px 56px;display:flex;flex-direction:column;gap:12px}
.sa h4{margin:0 0 20px;font-size:32px;line-height:56px}
.px .r{height:calc(var(--rh,76)*1px);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 16px 0 28px;border-radius:16px;background:var(--sbg);font-size:calc(var(--ts,28)*1px);transition:height .25s var(--out)}
.px .r em{font-style:normal;color:var(--st2);display:flex;align-items:center;gap:6px;padding-right:8px}
.px .sw{flex:none;width:88px;height:52px;border-radius:26px;background:var(--ssf2);position:relative}
.px .sw::after{content:"";position:absolute;left:4px;top:4px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18)}
.px .sw.on{background:var(--sac)}.px .sw.on::after{left:40px}
.px .sg{display:flex;height:60px;padding:4px;border-radius:14px;background:var(--ssf2)}
.px .sg b{width:124px;display:grid;place-items:center;border-radius:11px;font-size:24px;font-weight:500;color:var(--st2)}
.px .sg b.on{background:var(--ssf);color:var(--stx)}
.px .bar2{width:440px;height:12px;border-radius:6px;background:var(--ssf2);margin-right:8px}.px .bar2 i{display:block;height:100%;border-radius:6px;background:var(--stx)}
/* A · before */
.px.pb{background:var(--ssf);display:flex;justify-content:center}
.pb .col{position:relative;width:390px;height:720px;background:var(--sbg);padding:0 16px;font-size:17px;line-height:22px}
.pb .st{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:15px;font-weight:600}
.pb .st i{display:flex;gap:4px}.pb .st i b{width:16px;height:10px;border-radius:2px;background:var(--stx)}
.pb .lt{font-size:34px;line-height:41px;font-weight:700;margin:6px 0 16px 4px}
.pb .grp{background:var(--ssf);border-radius:10px;overflow:hidden;margin-bottom:24px}
.pb .it{height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;box-shadow:inset 0 -1px 0 var(--sln)}.pb .it:last-child{box-shadow:none}
.pb .it .q{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff}
.pb .it span{flex:1}.pb .it em{font-style:normal;color:var(--st2);display:flex}
.pb .tg{width:51px;height:31px;border-radius:16px;background:#34c759;position:relative}
.pb .tg::after{content:"";position:absolute;left:22px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.pb .tg.off{background:var(--ssf2)}.pb .tg.off::after{left:2px}
.pb .tb2{position:absolute;left:0;right:0;bottom:0;height:83px;background:var(--ssf);display:flex;justify-content:space-around;padding-top:8px;box-shadow:inset 0 1px 0 var(--sln)}
.pb .tb2 div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;line-height:12px;color:var(--st2)}.pb .tb2 .on{color:var(--sac)}
/* B · media · after */
.px.sm{display:grid;grid-template-columns:733px 1fr}
.sm .np{padding:48px;display:flex;flex-direction:column}
.sm .art{width:264px;height:264px;border-radius:24px;background:linear-gradient(140deg,#d9d9d9,#8c8c8c)}
.sm .tt{margin-top:28px;font-size:40px;line-height:48px;font-weight:600}
.sm .ar{font-size:26px;line-height:34px;color:var(--st2)}
.sm .pg{margin-top:24px;height:8px;border-radius:4px;background:var(--ssf2)}.sm .pg i{display:block;height:100%;width:38%;border-radius:4px;background:var(--stx)}
.sm .tm{display:flex;justify-content:space-between;margin-top:10px;font-size:20px;color:var(--st2);font-variant-numeric:tabular-nums}
.sm .ctl{margin-top:auto;display:flex;align-items:center;gap:24px}
.sm .ctl span{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:var(--ssf)}
.sm .ctl span.pl{width:120px;background:var(--stx);color:var(--sbg)}
.sm .qu{background:var(--ssf);padding:48px 56px;display:flex;flex-direction:column;gap:12px}
.sm h4{margin:0 0 20px;font-size:32px;line-height:56px}
.sm .r{padding-left:12px}.sm .r .ca{flex:none;width:56px;height:56px;border-radius:12px;background:var(--ssf2)}
.sm .r .tx{flex:1;display:flex;flex-direction:column;line-height:1.2}.sm .r .tx small{font-size:20px;color:var(--st2)}
/* B · before */
.px.mb{padding:40px 48px}
.mb .gr{font-size:28px;line-height:34px;font-weight:700}
.mb .hh{margin:24px 0 12px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;width:1448px}.mb .hh span{font-size:13px;color:var(--st2)}
.mb .row{display:flex;gap:24px}
.mb .cv{width:160px}.mb .cv i{display:block;width:160px;height:160px;border-radius:8px}
.mb .cv b{display:block;margin-top:8px;font-size:14px;font-weight:500;line-height:18px}.mb .cv small{font-size:12px;color:var(--st2)}
.mb .mp{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--ssf);box-shadow:inset 0 1px 0 var(--sln);display:flex;align-items:center;gap:16px;padding:0 24px;font-size:13px}
.mb .mp i{width:40px;height:40px;border-radius:6px}.mb .mp .c{margin:0 auto;display:flex;gap:18px;align-items:center}
/* C · climate · after */
.px.sc2{display:flex;flex-direction:column}
.sc2 .zones{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 72px}
.sc2 .z{display:flex;flex-direction:column;gap:4px}.sc2 .z.r2{align-items:flex-end}
.sc2 .z small{font-size:26px;color:var(--st2)}
.sc2 .z b{font-size:168px;line-height:1;font-weight:300;font-variant-numeric:tabular-nums}
.sc2 .z b sup{font-size:64px;vertical-align:top;line-height:1.3;margin-left:6px;color:var(--st2)}
.sc2 .mid{display:flex;flex-direction:column;align-items:center;gap:20px}
.sc2 .fan{display:flex;gap:10px;align-items:flex-end;height:64px}.sc2 .fan i{width:20px;border-radius:5px;background:var(--ssf2)}.sc2 .fan i.on{background:var(--stx)}
.sc2 .mode{height:52px;padding:0 24px;border-radius:26px;background:var(--ssf);font-size:24px;line-height:52px;font-weight:500}
.sc2 .edge{display:flex;gap:16px;padding:0 24px 24px}
.sc2 .edge span{flex:1;height:calc(var(--rh,76)*1px + 20px);border-radius:20px;background:var(--ssf);display:grid;place-items:center;transition:height .25s var(--out)}
.sc2 .edge span.on{background:var(--stx);color:var(--sbg)}
.sc2 .edge em{flex:none;width:24px}
/* C · before */
.px.cb{padding:40px 336px}
.cb .h{font-size:22px;line-height:28px;font-weight:700}.cb .h small{display:block;font-size:14px;font-weight:400;color:var(--st2)}
.cb .gd{margin-top:32px;display:grid;grid-template-columns:repeat(3,400px);gap:24px}
.cb .cd{height:220px;border-radius:16px;background:var(--ssf);padding:20px 24px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cb .cd>small{font-size:13px;color:var(--st2);font-weight:500}
.cb .cd .v{font-size:40px;font-weight:600;margin-top:8px}
.cb .cd .bt{margin-top:auto;display:flex;gap:8px;justify-content:flex-end}
.cb .cd .bt i{width:28px;height:28px;border-radius:50%;background:var(--ssf2);display:grid;place-items:center}
.cb .cd .ln{margin-top:auto;height:4px;border-radius:2px;background:var(--ssf2)}.cb .cd .ln i{display:block;height:100%;width:60%;border-radius:2px;background:var(--sac)}
.cb .cd .pl{margin-top:auto;display:flex;gap:6px}.cb .cd .pl b{height:26px;padding:0 10px;border-radius:13px;background:var(--ssf2);font-size:12px;line-height:26px;font-weight:500}.cb .cd .pl b.on{background:var(--sac);color:#fff}
.cb .cd svg{margin-top:auto}

.card.hide{display:none}
.card.flash{animation:cf .5s var(--out)}@keyframes cf{from{opacity:0;transform:translateY(8px)}}
/* glance budget */
.budget{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
.budget div{display:flex;flex-direction:column;gap:6px;padding-top:12px;box-shadow:inset 0 1px 0 var(--line)}
.budget b{white-space:nowrap;font-size:22px;line-height:28px;font-weight:500;font-variant-numeric:tabular-nums}
.budget b i{font-style:normal;color:var(--t3);font-weight:400}
/* prompt tray */
.tray{margin-top:16px;border-radius:14px;background:var(--stage);padding:4px}
.tray .in{border-radius:11px;background:var(--panel);box-shadow:0 0 0 1px var(--line);padding:16px 18px}
.tray .ft{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 8px}
.tray .ft .copy{height:28px;padding:0 12px;border-radius:8px;background:var(--panel);box-shadow:0 0 0 1px var(--line);align-items:center}
/* home: sidebar index + grid (8pt grid; brand row aligns with page title, nav top aligns with grid top) */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh;max-width:1560px;margin:0 auto}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:40px 24px 32px 32px}
.side .brand{display:block;padding:0 12px;font-size:17px;line-height:17px;font-weight:600}
.nav{margin-top:39px;display:flex;flex-direction:column;gap:2px}

    const t=document.startViewTransition(set);t.ready.then(()=>r.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},{duration:300,easing:'cubic-bezier(.65,0,.35,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});t.finished.finally(()=>st.remove())})})();
route();
</script>
