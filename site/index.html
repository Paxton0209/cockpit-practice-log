/* Neutral only. Structure and proportion carry the page. No negative tracking. */
:root,[data-theme=light]{
  --bg:#f7f7f7;--stage:#f2f2f2;--panel:#fff;--ink:#0a0a0a;--t2:#5c5c5c;--t3:#9a9a9a;--line:rgba(0,0,0,.075);--fill:#efefef;--fill2:rgba(29,29,31,.08);--lift:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.06);--lift2:0 12px 32px -14px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.08);--accent:#0a7cff;
  --sbg:#f3f3f3;--ssf:#fff;--ssf2:#e6e6e6;--stx:#0a0a0a;--st2:#8a8a8a;--sln:#e8e8e8;--sac:#0a7cff;color-scheme:light}
[data-theme=dark]{
  --bg:#0a0a0a;--stage:#121212;--panel:#161616;--ink:#f5f5f5;--t2:#a3a3a3;--t3:#666;--line:rgba(255,255,255,.08);--fill:#222;--fill2:rgba(255,255,255,.09);--lift:0 0 0 1px rgba(255,255,255,.07);--lift2:0 0 0 1px rgba(255,255,255,.12),0 16px 40px -16px rgba(0,0,0,.7);--accent:#2b8fff;
  --sbg:#0b0b0b;--ssf:#191919;--ssf2:#2a2a2a;--stx:#f5f5f5;--st2:#8a8a8a;--sln:#262626;--sac:#2b8fff;color-scheme:dark}
:root{--font:Inter,-apple-system,BlinkMacSystemFont,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--out:cubic-bezier(.22,1,.36,1);--ease:cubic-bezier(.2,0,0,1);--io:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:400 15px/24px var(--font);color:var(--ink);background:var(--bg);letter-spacing:normal;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button{font:inherit;color:inherit;letter-spacing:normal;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0;font-weight:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.num{font-variant-numeric:tabular-nums}
.lbl13{font-size:13px;line-height:20px;color:var(--t3)}
.press{transition:transform .12s var(--ease),opacity .15s}.press:active{transform:scale(.97)}
.arrow{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--ink)}
.arrow i{transition:transform .35s var(--out);font-style:normal}.arrow:hover i{transform:translateX(3px)}

/* header */
header{position:sticky;top:0;z-index:30;height:64px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 -1px 0 transparent;transition:box-shadow .25s}

.mark::after{content:"";position:absolute;top:0;bottom:0;left:38.2%;width:2px;background:var(--bg);transition:left .7s var(--out)}

/* reveal */
[data-r]{opacity:0;transform:translateY(12px);transition:opacity .8s var(--ease),transform 1s var(--out);transition-delay:var(--d,0ms)}
[data-r].in{opacity:1;transform:none}




/* progress */

@keyframes pulse{50%{opacity:.3}}

.tip{position:fixed;z-index:50;pointer-events:none;padding:5px 9px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;line-height:16px;opacity:0;transform:translate(-50%,-6px);transition:opacity .15s;white-space:nowrap}

/* entries */

.card:hover .thumb .scr{transform:translateY(-50%) scale(1.02)}
.thumb .after{position:absolute;inset:0;clip-path:inset(0 100% 0 0)}
.thumb .lb{position:absolute;left:12px;top:10px;font-size:12px;color:var(--t3);transition:opacity .3s}
.thumb .lb.a{opacity:0}
.thumb .cur{position:absolute;left:0;top:0;z-index:2;width:14px;height:14px;opacity:0;pointer-events:none}

.card.play .thumb .after{animation:wipe 6.4s var(--io) infinite;animation-delay:var(--ld,0s)}
.card.play .thumb .cur{animation:curmove 6.4s var(--io) infinite;animation-delay:var(--ld,0s)}
.card.play .thumb .lb.b{animation:lb 6.4s linear infinite;animation-delay:var(--ld,0s)}
.card.play .thumb .lb.a{animation:la 6.4s linear infinite;animation-delay:var(--ld,0s)}
@keyframes wipe{0%,22%{clip-path:inset(0 100% 0 0)}48%,78%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes curmove{0%{opacity:0;left:16%;top:66%}12%{opacity:1;left:16%;top:64%}22%{left:20%;top:60%}48%{left:84%;top:56%}70%{opacity:1;left:84%;top:56%}80%,100%{opacity:0;left:88%;top:70%}}
@keyframes lb{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}
@keyframes la{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
.card:hover .thumb .after{animation:none;clip-path:inset(0 0 0 0);transition:clip-path .7s var(--out)}
.card:hover .thumb .cur{animation:none;opacity:0}

function morph(st,to,quiet){

const COPY_TIMING={out:100,in:120,labelDelay:40,tickDelay:80,tick:180,hold:1000,returnOut:100,returnIn:180};
let copyAudio,copyNoiseBuffer;
function prepareCopyAudio(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;copyAudio??=new A();if(copyAudio.state==='suspended')copyAudio.resume().catch(()=>{})}catch(_){}}
function playCopyTap(){try{const audio=copyAudio;if(!audio||audio.state!=='running')return;
  if(!copyNoiseBuffer){copyNoiseBuffer=audio.createBuffer(1,Math.ceil(audio.sampleRate*.03),audio.sampleRate);const d=copyNoiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const t=audio.currentTime;const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),ng=audio.createGain();
  noise.buffer=copyNoiseBuffer;filter.type='bandpass';filter.frequency.value=3200;filter.Q.value=2.5;
  ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.22,t+.001);ng.gain.exponentialRampToValueAtTime(.0001,t+.03);
  noise.connect(filter).connect(ng).connect(audio.destination);noise.start(t);noise.stop(t+.03);
  const tone=audio.createOscillator(),tg=audio.createGain();tone.type='sine';tone.frequency.setValueAtTime(180,t);tone.frequency.exponentialRampToValueAtTime(90,t+.03);
  tg.gain.setValueAtTime(0,t);tg.gain.linearRampToValueAtTime(.08,t+.001);tg.gain.exponentialRampToValueAtTime(.0001,t+.03);
  tone.connect(tg).connect(audio.destination);tone.start(t);tone.stop(t+.03);
  noise.onended=()=>{noise.disconnect();filter.disconnect();ng.disconnect()};tone.onended=()=>{tone.disconnect();tg.disconnect()};}catch(_){}}
async function copyPrompt(btn,text){

  btn._req=0;

  const replay=Boolean(btn.dataset.copyState);const fi=replay?+getComputedStyle(idle).opacity:1,fr=replay?+getComputedStyle(res).opacity:0;

}
function wireSheet(){
  const st=$('#cstage'),sg=$('#seg4');
  const set=v=>{$$('button',sg).forEach(b=>b.classList.toggle('on',b.dataset.v===v));sg._place&&sg._place(true);morph(st,v)};
  seg(sg,b=>{morph(st,b.dataset.v);mem.set('v',b.dataset.v)});
  if(mem.get('v')==='b'){morph(st,'b',true);$$('button',sg).forEach(b=>b.classList.toggle('on',b.dataset.v==='b'))}
  $('#dClose').onclick=()=>go('home');
  $$('[data-copy]').forEach(b=>b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();copyPrompt(b,b.dataset.copy==='svg'?CMP[ENTRIES[curN-1].s].svg:$('.ptxt').textContent)});
  $$('details.row').forEach(d=>{const sm=$('summary',d),rb=$('.rbx',d);sm.onclick=ev=>{if(ev.target.closest('button'))return;ev.preventDefault();if(RM.matches){d.open=!d.open;return}
    rb.getAnimations().forEach(a=>a.cancel());
    if(d.open){d.classList.add('closing');rb.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-4px)'}],{duration:140,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}).onfinish=()=>{d.open=false;d.classList.remove('closing');rb.getAnimations().forEach(a=>a.cancel())}}
    else{d.open=true;rb.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],{duration:280,easing:'cubic-bezier(.2,0,0,1)'})}}});

let roF=0;const shRO=new ResizeObserver(()=>{cancelAnimationFrame(roF);roF=requestAnimationFrame(()=>{const sh=$('#sheet2'),sc=$('#sc');if(!sh||!sc||lens!=='open'||COMPACT.matches)return;const as=sc.getAnimations();if(as.some(x=>x.playState==='running'))return;Object.assign(sc.style,cstyle(rbox(sh.getBoundingClientRect(),20)));as.forEach(x=>x.cancel())})});
function ensureOv(){let ov=$('#ov');if(ov)return ov;ov=document.createElement('div');ov.className='ov';ov.id='ov';
  ov.innerHTML='<div class="veil" id="veil"></div><div class="sc" id="sc"><i></i></div><div class="sheet2" id="sheet2" tabindex="-1" role="dialog" aria-modal="true"></div>';
  document.body.appendChild(ov);$('#veil').onclick=()=>go('home');shRO.observe($('#sheet2'));return ov}
function openEntry(n){

}
function finish(){stop();const ov=$('#ov');$('#veil').style.opacity='';$('#sheet2').style.overflow='';ov.classList.remove('open');document.body.classList.remove('lock');$('#sheet2').innerHTML='';lens='closed';
  const f=anchor?.isConnected?anchor:null;curN=0;anchor=null;if(f)f.focus({preventScroll:true})}

(()=>{const h=new Date().getHours(),root=document.documentElement;root.dataset.theme=mem.get('theme')==='dark'?'dark':'light';let want=root.dataset.theme,busy=false;
  const set=t=>{root.dataset.theme=t;mem.set('theme',t)};
