<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Practice Log — wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tone follows Dashline: warm off-white, hairlines, quiet type, motion with purpose. No negative tracking. */
:root,[data-theme=light]{
  --bg:#efefee;--panel:#fff;--stage:#f6f6f5;--ink:#1d1d1f;--t2:rgba(29,29,31,.74);--t3:rgba(29,29,31,.56);--t4:rgba(29,29,31,.22);
  --b1:#e3e3e1;--b2:#d7d7d5;--b3:#c9c9c7;--line:rgba(29,29,31,.08);--sel:rgba(29,29,31,.06);--fill:rgba(29,29,31,.05);
  --accent:#007aff;--sh:0 1px 2px rgba(0,0,0,.05),0 1px 4px rgba(0,0,0,.04);--lift:0 12px 32px -14px rgba(0,0,0,.22);--dlg:0 24px 64px -16px rgba(0,0,0,.28);
  color-scheme:light}
[data-theme=dark]{
  --bg:#0f0f10;--panel:#18181a;--stage:#141416;--ink:#f2f2f4;--t2:rgba(242,242,244,.74);--t3:rgba(242,242,244,.52);--t4:rgba(242,242,244,.18);
  --b1:#232326;--b2:#2c2c30;--b3:#38383c;--line:rgba(242,242,244,.08);--sel:rgba(242,242,244,.08);--fill:rgba(242,242,244,.05);
  --accent:#0a84ff;--sh:0 0 0 1px rgba(255,255,255,.06);--lift:0 0 0 1px rgba(255,255,255,.1);--dlg:0 0 0 1px rgba(255,255,255,.08),0 24px 64px -16px rgba(0,0,0,.6);
  color-scheme:dark}
:root{--font:Inter,-apple-system,BlinkMacSystemFont,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--out:cubic-bezier(.22,1,.36,1);--ease:cubic-bezier(.2,0,0,1);--io:cubic-bezier(.65,0,.35,1);--w:1120px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:400 15px/22px var(--font);color:var(--ink);background:var(--bg);letter-spacing:normal;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button{font:inherit;color:inherit;letter-spacing:normal;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 32px}
.g{display:block;border-radius:4px;background:var(--b1)}
.g.d{background:var(--b2)}.g.dd{background:var(--b3)}
.press{transition:transform .12s var(--ease),opacity .15s,background-color .15s}
.press:active{transform:scale(.97)}
.num{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:30;height:60px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:inset 0 -1px 0 transparent;transition:box-shadow .25s}
header.sc{box-shadow:inset 0 -1px 0 var(--line)}
.hd{height:100%;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.mark{width:22px;height:22px;border-radius:6px;background:var(--ink);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;top:0;bottom:0;left:38.2%;width:2px;background:var(--bg);transition:left .7s var(--out)}
.brand:hover .mark::after{left:61.8%}
.sp{flex:1}
.prog{display:flex;align-items:center;gap:10px;height:32px;padding:0 12px 0 10px;border-radius:8px;background:var(--fill);font-size:13px;color:var(--t2)}
.prog .bar{width:64px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px;transition:width 1.2s var(--out)}
.prog b{font-weight:500;color:var(--ink)}
.tl{font-size:14px;color:var(--t2);transition:color .15s}.tl:hover{color:var(--ink)}
.btn{height:32px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.btn.k{background:var(--ink);color:var(--bg)}
.btn.k:hover{opacity:.88}
.btn.s{background:var(--fill)}
.btn.s:hover{background:var(--sel)}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.ib:hover{background:var(--sel)}

/* views */
.view{animation:viewIn .5s var(--out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
[data-r]{opacity:0;transform:translateY(12px);transition:opacity .7s var(--ease),transform .9s var(--out);transition-delay:var(--d,0ms)}
[data-r].in{opacity:1;transform:none}

/* hero stage (3D cockpit placeholder) */
.hero{padding-top:28px}
.stage{position:relative;aspect-ratio:21/9;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,var(--stage),var(--b1));perspective:1400px}
.cabin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.2s var(--out)}
.pillar{position:absolute;top:-10%;bottom:30%;width:9%;background:var(--b2);border-radius:40px}
.pillar.l{left:-2%;transform:skewX(14deg)}.pillar.r{right:-2%;transform:skewX(-14deg)}
.dash{position:absolute;left:4%;right:4%;top:52%;height:34%;border-radius:40px 40px 24px 24px;background:var(--b2)}
.dash::after{content:"";position:absolute;left:3%;right:3%;top:18%;height:3%;border-radius:4px;background:var(--b3);opacity:.6}
.wheel{position:absolute;left:12%;top:46%;width:21%;aspect-ratio:1;border-radius:50%;border:clamp(10px,1.6vw,18px) solid var(--b3);transition:transform 1.2s var(--out)}
.wheel::after{content:"";position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:28%;background:var(--b3)}
.console{position:absolute;left:44%;width:12%;top:80%;height:30%;border-radius:20px;background:var(--b3)}
.screen{position:absolute;left:38.5%;top:24%;width:27%;aspect-ratio:16/10;border-radius:10px;background:#141416;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);overflow:hidden;transform:translateZ(30px)}
[data-theme=dark] .screen{background:#050506}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:38.2% 1fr;opacity:0;transform:scale(1.03);transition:opacity .8s var(--ease),transform 1.2s var(--out)}
.slide.on{opacity:1;transform:none}
.slide .sc{background:linear-gradient(180deg,#2a2a2e,#1c1c1f)}
.slide .ap{background:#202024;padding:10%;display:flex;flex-direction:column;gap:7%}
.slide .ap i{display:block;border-radius:4px;background:#34343a}
.slide .ap i.a{background:#0a84ff;opacity:.85}
.glare{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);transform:translateX(var(--gx,0));transition:transform 1.2s var(--out);pointer-events:none}
.cap{position:absolute;left:24px;bottom:20px;right:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.cap .t{display:flex;flex-direction:column;gap:8px}
.cap .n{font-size:13px;color:var(--t2)}
.dots{display:flex;gap:6px}
.dots button{width:18px;height:4px;border-radius:2px;background:var(--t4);overflow:hidden;position:relative}
.dots button i{position:absolute;inset:0;width:0;background:var(--ink)}
.dots button.on i{animation:fill 4.2s linear forwards}
@keyframes fill{to{width:100%}}

/* intro row */
.intro{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;padding-top:40px;padding-bottom:8px}
.intro .l{display:flex;flex-direction:column;gap:12px}
.intro .acts{display:flex;gap:8px}

/* 100 track */
.track{padding:32px 0;display:grid;grid-template-columns:168px 1fr;gap:24px;align-items:center;box-shadow:inset 0 -1px 0 var(--line)}
.track>b{font-weight:500}
.ticks{display:grid;grid-template-columns:repeat(50,1fr);gap:4px}
.tick{position:relative;height:22px;border-radius:3px;background:var(--fill);transition:transform .3s var(--out),background-color .3s}
.tick.done{background:var(--ink);opacity:.85}
.tick.next{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink);animation:pulse 1.8s var(--io) infinite}
@keyframes pulse{50%{opacity:.35}}
.tick:hover{transform:scaleY(1.3)}
.tip{position:fixed;z-index:50;pointer-events:none;padding:5px 9px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;line-height:16px;opacity:0;transform:translate(-50%,-6px);transition:opacity .15s}
.tip.on{opacity:1}

/* list */
.bar2{display:flex;align-items:center;gap:12px;padding:28px 0 20px}
.chips{position:relative;display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--fill)}
.chips button{position:relative;z-index:1;height:28px;padding:0 12px;border-radius:7px;font-size:13px;color:var(--t2);transition:color .2s}
.chips button.on{color:var(--ink)}
.chips .ind{position:absolute;top:3px;left:0;height:28px;border-radius:7px;background:var(--panel);box-shadow:var(--sh);transition:transform .4s var(--out),width .4s var(--out)}
.count{font-size:13px;color:var(--t3)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 20px;padding-bottom:40px}
.card{display:flex;flex-direction:column;gap:12px;text-align:left}
.thumb{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--stage);transition:box-shadow .35s var(--ease),transform .5s var(--out)}
.card:hover .thumb{transform:translateY(-2px)}
.thumb .scr{position:absolute;inset:14% 12%;border-radius:8px;overflow:hidden;background:var(--b2)}
.thumb .before,.thumb .after{position:absolute;inset:0;display:grid;grid-template-columns:38.2% 1fr}
.thumb .before{background:var(--b2)}
.thumb .before i{display:block}
.thumb .before .bx{margin:12%;border-radius:12px;background:var(--b3)}
.thumb .after{clip-path:inset(0 100% 0 0);transition:clip-path .7s var(--out)}
.thumb .after .sc{background:var(--b3)}
.thumb .after .ap{background:var(--panel);padding:12% 10%;display:flex;flex-direction:column;gap:9%}
.thumb .after .ap i{display:block;height:14%;border-radius:3px;background:var(--b1)}
.thumb .after .ap i.a{width:30%;margin-left:auto;background:var(--accent);opacity:.8;border-radius:9px}
.card:hover .thumb .after{clip-path:inset(0 0 0 0)}
.thumb .lbl{position:absolute;left:10px;top:10px;height:20px;padding:0 7px;border-radius:5px;background:color-mix(in srgb,var(--panel) 85%,transparent);font-size:11px;line-height:20px;color:var(--t2);transition:opacity .3s}
.thumb .lbl.a{opacity:0}
.card:hover .thumb .lbl.b{opacity:0}.card:hover .thumb .lbl.a{opacity:1}
.meta{display:flex;flex-direction:column;gap:8px}
.meta .top{display:flex;justify-content:space-between;font-size:13px;color:var(--t3)}
.meta .top b{font-weight:500;color:var(--ink)}
.card.soon{pointer-events:none}
.card.soon .thumb{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.card.soon .thumb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,var(--fill) 10px 11px)}

/* chapters track */
.chap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:12px;padding:28px 0 32px;box-shadow:inset 0 -1px 0 var(--line)}
.chap .c{display:flex;flex-direction:column;gap:10px}
.chap .tk{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.chap .tk i{height:14px;border-radius:2px;background:var(--fill);transition:transform .3s var(--out)}
.chap .tk i.done{background:var(--ink);opacity:.82}
.chap .tk i.next{box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent;animation:pulse 1.8s var(--io) infinite}
.chap .tk i:hover{transform:scaleY(1.35)}
.chap .nm{font-size:12px;line-height:16px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .c.cur .nm{color:var(--ink)}
.line{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding-top:28px}
.line .r{font-size:14px;color:var(--t3)}
.line .r b{font-weight:500;color:var(--ink)}
/* prompts pair */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .prompt .h{font-size:13px;color:var(--t3);margin-bottom:14px}
.pair .prompt.k .h{color:var(--ink)}
/* follow band */
.follow{margin:24px 0 0;padding:56px 0;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:inset 0 1px 0 var(--line)}
.follow .l{display:flex;flex-direction:column;gap:12px}
footer{margin-top:80px;padding-bottom:40px;font-size:13px;color:var(--t3)}
footer .in{display:flex;justify-content:space-between;padding-top:24px;box-shadow:inset 0 1px 0 var(--line)}

/* entry */
.crumb{display:flex;align-items:center;justify-content:space-between;padding:28px 0 0}
.crumb a{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--t2)}
.crumb a:hover{color:var(--ink)}
.pn{display:flex;gap:4px}
.ehead{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;padding:36px 0 12px}
.big{font-size:88px;line-height:80px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.ehead .l{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.tag{display:inline-flex;align-self:flex-start;height:24px;padding:0 9px;border-radius:6px;background:var(--fill);font-size:12px;line-height:24px;color:var(--t2)}

/* compare */
.cmp{border-radius:16px;background:var(--panel);box-shadow:var(--sh);overflow:hidden}
.cmp .top{height:52px;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px;box-shadow:inset 0 -1px 0 var(--line)}
.cmp .top .sp{flex:1}
.cstage{position:relative;aspect-ratio:16/9;margin:10px;border-radius:10px;overflow:hidden;background:var(--stage);user-select:none;touch-action:none;cursor:ew-resize}
.pane{position:absolute;inset:6% 8%;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:38.2% 1fr}
.pane.b{background:var(--b2);grid-template-columns:1fr}
.pane.b .ph{padding:6%;display:grid;grid-template-columns:1fr 1fr;gap:5%}
.pane.b .ph i{border-radius:20px;background:var(--b3)}
.pane.a .sc{background:linear-gradient(180deg,var(--b3),var(--b2))}
.pane.a .ap{background:var(--panel);padding:6% 6%;display:flex;flex-direction:column;gap:4%}
.pane.a .row{display:flex;align-items:center;justify-content:space-between;height:13%;padding:0 4%;border-radius:8px;background:var(--stage)}
.pane.a .row i{display:block;height:28%;border-radius:3px;background:var(--b2)}
.pane.a .row .sw{width:11%;height:52%;border-radius:99px;background:var(--accent);opacity:.85}
.pane.a .seg{height:13%;border-radius:10px;background:var(--b1);padding:.6%;display:flex}
.pane.a .seg i{flex:1;border-radius:8px}
.pane.a .seg i.on{background:var(--panel);box-shadow:var(--sh)}
.clip{position:absolute;inset:0;clip-path:inset(0 0 0 var(--x,50%));transition:clip-path .0s}
.cstage.anim .clip{transition:clip-path .7s var(--out)}
.handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:0;z-index:2}
.cstage.anim .handle{transition:left .7s var(--out)}
.handle::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--panel);box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.handle span{position:absolute;top:50%;left:0;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:var(--panel);box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;transition:transform .25s var(--out)}
.cstage:active .handle span{transform:scale(.92)}
.plab{position:absolute;top:16px;height:22px;padding:0 8px;border-radius:6px;background:color-mix(in srgb,var(--panel) 88%,transparent);font-size:12px;line-height:22px;color:var(--t2);z-index:1}
.plab.b{left:16px}.plab.a{right:16px}

/* principle, prompt, why */
.blk{display:grid;grid-template-columns:168px 1fr;gap:24px;padding:36px 0;box-shadow:inset 0 -1px 0 var(--line)}
.blk>b{font-weight:500;padding-top:2px}
.prin{display:flex;flex-direction:column;gap:14px}
.prin .g{height:22px}
.prompt{position:relative;border-radius:12px;background:var(--panel);box-shadow:var(--sh);padding:20px 20px 20px 22px}
.prompt .lines{display:flex;flex-direction:column;gap:11px;padding-right:96px}
.prompt .lines .g{height:9px}
.copy{position:absolute;top:14px;right:14px;height:32px;padding:0 12px;border-radius:8px;background:var(--fill);font-size:13px;display:flex;align-items:center;gap:6px;overflow:hidden}
.copy:hover{background:var(--sel)}
.copy .s{display:inline-flex;align-items:center;gap:6px;transition:transform .45s var(--out),opacity .25s}
.copy .s2{position:absolute;left:12px;transform:translateY(120%);opacity:0}
.copy.done .s1{transform:translateY(-120%);opacity:0}.copy.done .s2{transform:none;opacity:1}
.why{border-radius:12px;background:var(--panel);box-shadow:var(--sh);overflow:hidden}
.why>button{width:100%;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;text-align:left}
.why .pm{width:14px;height:14px;position:relative}
.why .pm::before,.why .pm::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:1px;background:var(--t2);transition:transform .45s var(--out)}
.why .pm::after{transform:rotate(90deg)}
.why.open .pm::after{transform:rotate(0)}
.why .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--out)}
.why.open .body{grid-template-rows:1fr}
.why .body>div{overflow:hidden}
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px 20px;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .5s var(--out)}
.why.open .details{opacity:1;transform:none;transition-delay:.1s}
.det{border-radius:10px;background:var(--stage);padding:16px;display:flex;flex-direction:column;gap:12px}
.det .viz{position:relative;height:96px;border-radius:8px;background:var(--b1);display:grid;place-items:center}
.det .viz .box{width:44%;height:36%;border-radius:8px;background:var(--b3)}
.det .viz .dim{position:absolute;left:28%;right:28%;bottom:18px;height:1px;background:var(--accent)}
.det .viz .dim::before,.det .viz .dim::after{content:"";position:absolute;top:-4px;width:1px;height:9px;background:var(--accent)}
.det .viz .dim::before{left:0}.det .viz .dim::after{right:0}
.det .g{height:8px}
.rules{display:flex;gap:8px;flex-wrap:wrap}
.rules span{height:28px;padding:0 10px;border-radius:7px;background:var(--fill);font:400 12px/28px var(--mono);color:var(--t2)}
.next2{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:36px 0 0}
.next2 a{height:88px;border-radius:12px;background:var(--panel);box-shadow:var(--sh);padding:0 20px;display:flex;align-items:center;gap:16px;transition:box-shadow .35s,transform .5s var(--out)}
.next2 a:hover{box-shadow:var(--lift);transform:translateY(-2px)}
.next2 a .n{font-size:28px;font-weight:500;color:var(--t3);font-variant-numeric:tabular-nums}
.next2 a .l{flex:1;display:flex;flex-direction:column;gap:8px}
.next2 a.r{flex-direction:row-reverse;text-align:right}
.next2 a.r .l{align-items:flex-end}
.toast{position:fixed;left:50%;bottom:28px;z-index:60;height:36px;padding:0 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13px;display:flex;align-items:center;opacity:0;transform:translate(-50%,8px);transition:opacity .2s,transform .45s var(--out);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}

@media(max-width:860px){.chap{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:20px}.pair{grid-template-columns:1fr}.wrap{padding:0 20px}.stage{aspect-ratio:4/3}.screen{left:30%;width:42%}.intro,.follow{grid-template-columns:1fr}.track,.blk{grid-template-columns:1fr;gap:12px}.ticks{grid-template-columns:repeat(25,1fr)}.grid{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr}.big{font-size:64px;line-height:60px}.prog .bar{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.btn.s.hide-sm{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:1ms!important}[data-r]{opacity:1;transform:none}}
</style>
</head>
<body>
<header id="hdr"><div class="wrap hd">
  <a class="brand" href="#home"><span class="mark"></span>Cockpit Practice Log</a>
  <span class="sp"></span>
  <a class="tl" href="#follow">Follow on X</a>
  <button class="ib press" id="theme" aria-label="Day / Night"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13Z" fill="currentColor"/></svg></button>
</div></header>

<main id="app"></main>
<div class="tip" id="tip"></div>
<div class="toast" id="toast">Prompt copied</div>

<script>
const PUBLISHED=12, TOTAL=100;
const CHAPTERS=['Layout','Hierarchy','Controls','Color','Type','Icons','Motion','States','Voice & AI','Screens'];
const rnd=(i,s=1)=>{const x=Math.sin(i*9301+s*49297)*233280;return x-Math.floor(x)};
const ENTRIES=Array.from({length:TOTAL},(_,i)=>({n:i+1,cat:CHAPTERS[Math.floor(i/10)],w1:55+rnd(i,1)*35,w2:30+rnd(i,2)*35}));
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(3,'0');
const g=(w,h=10,c='')=>`<span class="g ${c}" style="width:${w};height:${h}px"></span>`;
const ARROW_L='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>';
const ARROW_R='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg>';

function thumb(e){return `<div class="thumb"><div class="scr"><div class="before"><i class="bx"></i><i class="bx"></i></div><div class="after"><i class="sc"></i><div class="ap"><i style="width:${e.w1}%"></i><i style="width:${e.w2+20}%"></i><i class="a"></i><i style="width:${e.w2}%"></i></div></div></div><span class="lbl b">Before</span><span class="lbl a">After</span></div>`}
function card(e,i){
  const soon=e.n>PUBLISHED;
  return `<a class="card ${soon?'soon':''}" href="#entry-${pad(e.n)}" data-cat="${e.cat}" data-r style="--d:${(i%3)*60}ms">
    ${soon?'<div class="thumb"></div>':thumb(e)}
    <div class="meta"><div class="top"><b class="num">#${pad(e.n)}</b><span>${soon?'Coming':e.cat}</span></div>${g(e.w1+'%',10,soon?'':'d')}${soon?'':g(e.w2+'%',8)}</div></a>`;
}
function slide(k){return `<div class="slide" data-i="${k}"><i class="sc"></i><div class="ap">${[0,1,2,3].map(j=>`<i style="height:12%;width:${45+rnd(j,k+2)*45}%" class="${j===2?'a':''}"></i>`).join('')}</div></div>`}

function viewHome(){
  const latest=ENTRIES.slice(0,PUBLISHED).reverse();
  const shown=[...latest,...ENTRIES.slice(PUBLISHED,PUBLISHED+3)];
  return `
  <section class="wrap hero">
    <div class="stage" id="stage" data-r>
      <div class="cabin" id="cabin">
        <i class="pillar l"></i><i class="pillar r"></i><i class="dash"></i><i class="wheel" id="wheel"></i><i class="console"></i>
        <div class="screen" id="screen">${[0,1,2].map(slide).join('')}<i class="glare" id="glare"></i></div>
      </div>
      <div class="cap"><div class="t"><span class="n num" id="capN">#${pad(PUBLISHED)}</span></div><div class="dots" id="dots">${[0,1,2].map(k=>`<button aria-label="Slide ${k+1}"><i></i></button>`).join('')}</div></div>
    </div>
    <div class="line" data-r style="--d:80ms">${g('min(460px,70%)',14,'d')}<span class="r num"><b>${pad(PUBLISHED)}</b> / 100</span></div>
  </section>

  <section class="wrap"><div class="chap" id="ticks" data-r style="--d:140ms">${CHAPTERS.map((c,ci)=>`<div class="c ${Math.floor(PUBLISHED/10)===ci?'cur':''}"><div class="tk">${ENTRIES.slice(ci*10,ci*10+10).map(e=>`<i class="${e.n<=PUBLISHED?'done':e.n===PUBLISHED+1?'next':''}" data-n="${e.n}"></i>`).join('')}</div><span class="nm">${String(ci+1).padStart(2,'0')} ${c}</span></div>`).join('')}</div></section>

  <section class="wrap" style="padding-top:32px">
    <div class="grid" id="grid">${shown.map(card).join('')}</div>
  </section>
  ${foot('Follow on X')}`;
}
function foot(r){return `<footer class="wrap" id="followSec"><div class="in"><span>Cockpit Practice Log · by Peixin</span><span><a class="tl" href="#follow">${r}</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a class="tl" href="#follow">LinkedIn</a></span></div></footer>`}

function viewEntry(n){
  const e=ENTRIES[n-1]||ENTRIES[0], prev=ENTRIES[n-2], next=ENTRIES[n];
  const nextLive=next&&next.n<=PUBLISHED;
  return `
  <section class="wrap">
    <div class="crumb"><a href="#home">${ARROW_L}All entries</a><div class="pn"><a class="ib press" href="${prev?'#entry-'+pad(prev.n):'#home'}" aria-label="Previous">${ARROW_L}</a><a class="ib press" href="${nextLive?'#entry-'+pad(next.n):'#home'}" aria-label="Next">${ARROW_R}</a></div></div>
    <div class="ehead"><div class="big" data-r>${pad(e.n)}</div><div class="l" data-r style="--d:80ms"><span class="tag">${String(Math.floor((e.n-1)/10)+1).padStart(2,'0')} ${e.cat}</span>${g('min(560px,95%)',28,'d')}</div></div>
    <div class="prin" data-r style="--d:110ms;padding:0 0 32px">${g('min(640px,92%)',16,'dd')}</div>

    <div class="cmp" data-r style="--d:140ms">
      <div class="top"><span style="font-weight:500">Before / After</span><span class="sp"></span>
        <div class="chips" id="cmpSeg"><span class="ind"></span><button data-x="0">Before</button><button class="on" data-x="50">Split</button><button data-x="100">After</button></div>
      </div>
      <div class="cstage" id="cstage" style="--x:50%">
        <div class="pane b"><div class="ph"><i></i><i></i><i></i><i></i></div></div>
        <div class="clip"><div class="pane a"><i class="sc"></i><div class="ap">
          <div class="row"><i style="width:38%"></i><span class="sw"></span></div>
          <div class="row"><i style="width:30%"></i><span class="sw"></span></div>
          <div class="seg"><i class="on"></i><i></i><i></i></div>
          <div class="row"><i style="width:44%"></i><i style="width:12%"></i></div>
        </div></div></div>
        <span class="plab b">Before</span><span class="plab a">After</span>
        <div class="handle"><span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 2 8l4 4M10 4l4 4-4 4"/></svg></span></div>
      </div>
    </div>

        <div class="blk" data-r><b>Prompt</b><div class="pair">
      <div class="prompt"><div class="h">Default</div><div class="lines">${[80,64,72].map(w=>g(w+'%',9)).join('')}</div></div>
      <div class="prompt k"><div class="h">With cockpit rules</div><div class="lines">${[88,72,94,60,80,45].map((w,i)=>g(w+'%',9,i%3===0?'d':'')).join('')}</div>
      <button class="copy press" id="copyBtn"><span class="s s1"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>Copy</span><span class="s s2"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>Copied</span></button></div>
    </div></div>
    <div class="blk" data-r><b>Why</b><div class="why" id="why"><button><span style="font-weight:500">For practitioners</span><span class="pm"></span></button><div class="body"><div><div class="details">${[0,1,2].map(k=>`<div class="det"><div class="viz"><i class="box" style="width:${[44,30,56][k]}%"></i><i class="dim"></i></div>${g('60%',10,'d')}${g('90%',8)}${g('75%',8)}</div>`).join('')}</div></div></div></div></div>
    <div class="blk" data-r style="box-shadow:none"><b>Rules</b><div class="rules"><span>PR-01</span><span>PR-03</span><span>CT-02</span></div></div>

    <div class="next2" data-r>
      ${prev?`<a href="#entry-${pad(prev.n)}"><span class="n">${pad(prev.n)}</span><span class="l">${g('80%',10,'d')}${g('50%',8)}</span></a>`:'<span></span>'}
      ${nextLive?`<a class="r" href="#entry-${pad(next.n)}"><span class="n">${pad(next.n)}</span><span class="l">${g('80%',10,'d')}${g('50%',8)}</span></a>`:`<a class="r" href="#follow"><span class="n">${pad(PUBLISHED+1)}</span><span class="l"><span style="font-size:14px;color:var(--t2)">Next drop — follow to catch it</span></span></a>`}
    </div>
  </section>
  ${foot('Follow on X')}`;
}

/* behaviours */
function reveal(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{rootMargin:'0px 0px -8% 0px'});$$('[data-r]').forEach(el=>io.observe(el))}
function seg(el,onChange){const ind=$('.ind',el);const place=(b,anim)=>{if(!anim)ind.style.transition='none';ind.style.width=b.offsetWidth+'px';ind.style.transform=`translateX(${b.offsetLeft-3}px)`;if(!anim){ind.offsetWidth;ind.style.transition=''}};
  requestAnimationFrame(()=>place($('button.on',el),false));
  $$('button',el).forEach(b=>b.onclick=()=>{$$('button',el).forEach(o=>o.classList.toggle('on',o===b));place(b,true);onChange&&onChange(b)});
  el._place=()=>place($('button.on',el),false)}
addEventListener('resize',()=>$$('.chips').forEach(c=>c._place&&c._place()));

let carT;
function setupHome(){
  // count-up progress
  // carousel
  const slides=$$('.slide'),dots=$$('#dots button');let k=0;
  const show=i=>{k=i;slides.forEach((s,j)=>s.classList.toggle('on',j===i));dots.forEach((d,j)=>{d.classList.remove('on');void d.offsetWidth;d.classList.toggle('on',j===i)});$('#capN').textContent='#'+pad(PUBLISHED-i);
    $('#capN').animate([{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'none'}],{duration:400,easing:'cubic-bezier(.22,1,.36,1)'})};
  show(0);clearInterval(carT);carT=setInterval(()=>{if(!document.body.contains(slides[0]))return clearInterval(carT);show((k+1)%slides.length)},4200);
  dots.forEach((d,i)=>d.onclick=()=>{show(i);clearInterval(carT);carT=setInterval(()=>show((k+1)%slides.length),4200)});
  // camera drift
  const st=$('#stage'),cab=$('#cabin'),wh=$('#wheel'),gl=$('#glare');
  st.addEventListener('pointermove',e=>{const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    cab.style.transform=`rotateY(${x*5}deg) rotateX(${-y*3}deg) scale(1.02)`;wh.style.transform=`rotate(${x*-6}deg)`;gl.style.setProperty('--gx',`${x*60}%`)});
  st.addEventListener('pointerleave',()=>{cab.style.transform='';wh.style.transform='';gl.style.setProperty('--gx','0')});
  // ticks tooltip
  const tip=$('#tip');
  $('#ticks').addEventListener('pointerover',e=>{const t=e.target.closest('.tk i');if(!t)return;const n=+t.dataset.n,r=t.getBoundingClientRect();
    tip.textContent=`#${pad(n)} · ${n<=PUBLISHED?'Published':n===PUBLISHED+1?'Next drop':'Coming'}`;tip.style.left=r.left+r.width/2+'px';tip.style.top=r.top-30+'px';tip.classList.add('on')});
  $('#ticks').addEventListener('pointerleave',()=>tip.classList.remove('on'));
  $('#ticks').addEventListener('click',e=>{const t=e.target.closest('.tk i.done');if(t)location.hash='entry-'+pad(+t.dataset.n)});
}
function setupEntry(){
  const st=$('#cstage');let drag=false;
  const setX=(p,anim)=>{st.classList.toggle('anim',!!anim);st.style.setProperty('--x',Math.max(0,Math.min(100,p))+'%')};
  const fromEvent=e=>{const r=st.getBoundingClientRect();return (e.clientX-r.left)/r.width*100};
  st.addEventListener('pointerdown',e=>{drag=true;st.setPointerCapture(e.pointerId);setX(fromEvent(e),true);setTimeout(()=>st.classList.remove('anim'),300)});
  st.addEventListener('pointermove',e=>{if(drag)setX(fromEvent(e),false)});
  st.addEventListener('pointerup',()=>{drag=false});
  seg($('#cmpSeg'),b=>setX(+b.dataset.x,true));
  // intro sweep to show the idea
  setTimeout(()=>{setX(22,true);setTimeout(()=>setX(50,true),800)},700);
  $('#copyBtn').onclick=async()=>{const b=$('#copyBtn');try{await navigator.clipboard.writeText('Prompt placeholder')}catch(_){}b.classList.add('done');const t=$('#toast');t.classList.add('show');setTimeout(()=>{b.classList.remove('done');t.classList.remove('show')},1500)};
  $('#why>button').onclick=()=>$('#why').classList.toggle('open');
  addEventListener('keydown',keyNav);
}
function keyNav(e){if(!location.hash.startsWith('#entry-'))return removeEventListener('keydown',keyNav);if(e.key==='ArrowLeft')$('.pn a:first-child').click();if(e.key==='ArrowRight')$('.pn a:last-child').click()}


function route(){
  const h=location.hash.slice(1);
  const m=h.match(/^entry-(\d{3})$/);
  const go=()=>{$('#app').innerHTML=m?viewEntry(+m[1]):viewHome();scrollTo({top:0});reveal();m?setupEntry():setupHome();
    if(h==='follow'){const f=$('#followSec');f&&f.scrollIntoView({behavior:'smooth'})}};
  if(h==='follow'&&$('#followSec')){$('#followSec').scrollIntoView({behavior:'smooth'});return}
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&$('#app').childElementCount)document.startViewTransition(go);else go();
}
addEventListener('hashchange',route);
addEventListener('scroll',()=>$('#hdr').classList.toggle('sc',scrollY>4),{passive:true});

/* theme: follows local time like the Codex cockpit, toggle with circular reveal */
(()=>{const h=new Date().getHours();document.documentElement.dataset.theme=h>=6&&h<18?'light':'dark';
  $('#theme').onclick=()=>{const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark',set=()=>r.dataset.theme=n;
    if(!document.startViewTransition)return set();const b=$('#theme').getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    const st=document.createElement('style');st.textContent='::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}';document.head.appendChild(st);
    const t=document.startViewTransition(set);t.ready.then(()=>r.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},{duration:600,easing:'cubic-bezier(.65,0,.35,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});t.finished.finally(()=>st.remove())}})();

route();
</script>
</body>
</html>
