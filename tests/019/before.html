<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistant speech bar</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  * { box-sizing: border-box; }
  .bar {
    position: relative;
    width: 548px; height: 72px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 22px 0 14px;
    border-radius: 22px;
    background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
    border: 1px solid #e3e8ef;
    box-shadow: inset 0 1px 0 #ffffff, inset 0 -1px 0 rgba(15,23,42,0.03);
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }
  .bar::after { /* soft speaking glow along the bottom edge */
    content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #3b82f6 30%, #06b6d4 70%, transparent);
    opacity: 0; transform: scaleX(0.3);
    transition: opacity .4s ease, transform .6s ease;
  }
  .bar.speaking::after { opacity: .55; transform: scaleX(1); animation: sweep 2.4s ease-in-out infinite; }
  @keyframes sweep { 0%,100% { transform: translateX(-6%) scaleX(.9); } 50% { transform: translateX(6%) scaleX(.9); } }

  .orb {
    position: relative; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    background: radial-gradient(circle at 32% 28%, #7dd3fc 0%, #3b82f6 55%, #2563eb 100%);
    box-shadow: 0 0 0 0 rgba(59,130,246,0.0);
  }
  .orb::before {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 2px solid rgba(59,130,246,0.25); opacity: 0;
  }
  .bar.speaking .orb::before { animation: ring 1.8s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.18); opacity: 0; } }
  .orb i {
    display: block; width: 3px; height: 6px; border-radius: 2px; background: #fff;
    transition: height .12s ease;
  }

  .text {
    flex: 1; min-width: 0;
    font-size: 15.5px; line-height: 21px; font-weight: 500; letter-spacing: -0.005em;
    color: #0f172a;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .w {
    display: inline-block; opacity: 0; transform: translateY(5px); filter: blur(3px);
    color: #94a3b8;
    transition: opacity .28s ease, transform .32s cubic-bezier(.2,.8,.2,1), filter .28s ease, color .5s ease;
  }
  .w.on { opacity: 1; transform: none; filter: none; color: #0f172a; }
  .w.key.on { color: #2563eb; font-weight: 600; }
  .text.out .w { opacity: 0; transition: opacity .5s ease; }

  @media (prefers-reduced-motion: reduce) {
    .w { transition: none; opacity: 1; transform: none; filter: none; color: #0f172a; }
    .w.key { color: #2563eb; font-weight: 600; }
    .bar.speaking::after, .bar.speaking .orb::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="bar" id="bar" role="status" aria-live="polite">
    <div class="orb" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="text" id="text" aria-label="Opening all the windows and setting the cabin to 22°, with the rear windows halfway"></div>
  </div>
<script>
(function () {
  var words = [
    ["Opening"], ["all", 1], ["the", 1], ["windows", 1], ["and"], ["setting"], ["the"], ["cabin"],
    ["to"], ["22°,", 1], ["with"], ["the"], ["rear", 1], ["windows", 1], ["halfway", 1]
  ];
  var bar = document.getElementById("bar");
  var text = document.getElementById("text");
  var bars = bar.querySelectorAll(".orb i");
  var spans = words.map(function (w, i) {
    var s = document.createElement("span");
    s.className = "w" + (w[1] ? " key" : "");
    s.textContent = w[0];
    s.setAttribute("aria-hidden", "true");
    text.appendChild(s);
    if (i < words.length - 1) text.appendChild(document.createTextNode(" "));
    return s;
  });

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) { spans.forEach(function (s) { s.classList.add("on"); }); return; }

  var speaking = false, t0 = 0;
  function wave(now) {
    for (var i = 0; i < bars.length; i++) {
      var h = 6;
      if (speaking) {
        var t = now / 1000;
        h = 7 + Math.abs(Math.sin(t * (6.2 + i * 1.7) + i * 1.3)) * 11
              + Math.abs(Math.sin(t * 13.1 + i * 2.1)) * 4;
        if (i === 0 || i === 3) h *= 0.7;
      } else {
        h = 5 + Math.sin(now / 600 + i * 0.8) * 1.2;
      }
      bars[i].style.height = h.toFixed(1) + "px";
    }
    requestAnimationFrame(wave);
  }
  requestAnimationFrame(wave);

  function cycle() {
    text.classList.remove("out");
    spans.forEach(function (s) { s.classList.remove("on"); });
    speaking = true; bar.classList.add("speaking");
    var delay = 350;
    spans.forEach(function (s, i) {
      var len = words[i][0].length;
      setTimeout(function () { s.classList.add("on"); }, delay);
      delay += 150 + len * 28 + (/[,]$/.test(words[i][0]) ? 220 : 0);
    });
    setTimeout(function () { speaking = false; bar.classList.remove("speaking"); }, delay + 250);
    setTimeout(function () { text.classList.add("out"); }, delay + 3200);
    setTimeout(cycle, delay + 4000);
  }
  cycle();
})();
</script>
</body>
</html>
