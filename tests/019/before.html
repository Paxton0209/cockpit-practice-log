<div class="car-sound-card" aria-label="Sound settings">
  <style>
    .car-sound-card {
      box-sizing: border-box;
      width: 772px;
      height: 360px;
      padding: 24px 28px;
      overflow: hidden;
      border: 1px solid #dce4e8;
      border-radius: 24px;
      background: #f5f8f9;
      color: #162831;
      font: 500 14px/1.3 Inter, sans-serif;
      color-scheme: light;
    }

    .car-sound-card *, .car-sound-card *::before {
      box-sizing: border-box;
    }

    .car-sound-card header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 17px;
    }

    .car-sound-card h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.045em;
    }

    .car-sound-card form {
      margin: 0;
    }

    .car-sound-card button {
      position: absolute;
      top: 24px;
      right: 28px;
      min-width: 88px;
      height: 44px;
      border: 1px solid #d5e0e4;
      border-radius: 12px;
      background: #fff;
      color: #174e5a;
      cursor: pointer;
      font: 650 14px Inter, sans-serif;
    }

    .car-sound-card { position: relative; }

    .car-sound-card fieldset {
      min-width: 0;
      margin: 0;
      padding: 15px 18px 14px;
      border: 1px solid #dce4e8;
      border-radius: 18px;
      background: #fff;
    }

    .car-sound-card h3 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .car-sound-card .eq-plot {
      --track-height: 144px;
      position: relative;
      display: grid;
      grid-template-columns: 52px repeat(5, minmax(0, 1fr));
      align-items: start;
    }

    .car-sound-card .eq-grid {
      position: absolute;
      z-index: 0;
      top: 12px;
      right: 6px;
      left: 53px;
      height: 120px;
      pointer-events: none;
      border-block: 1px solid #e6edef;
    }

    .car-sound-card .eq-grid::before {
      position: absolute;
      top: 50%;
      right: 0;
      left: 0;
      border-top: 1px dashed #abbfc6;
      content: "";
    }

    .car-sound-card .eq-scale {
      display: flex;
      height: var(--track-height);
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 0;
      color: #506773;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .car-sound-card .eq-band {
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    .car-sound-card .eq-band input {
      appearance: none;
      writing-mode: vertical-lr;
      direction: rtl;
      width: 48px;
      height: var(--track-height);
      margin: 0;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(#bdcfd5, #bdcfd5)
        center / 4px calc(100% - 24px) no-repeat;
      cursor: ns-resize;
      accent-color: #087e83;
    }

    .car-sound-card .eq-band input::-webkit-slider-runnable-track {
      width: 48px;
      background: transparent;
    }

    .car-sound-card .eq-band input::-webkit-slider-thumb {
      appearance: none;
      width: 32px;
      height: 24px;
      margin-inline: 0;
      margin-block-start: 8px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: #087e83;
      box-shadow: 0 0 0 1px #087e83, 0 2px 4px #16283129;
    }

    .car-sound-card .eq-band input::-moz-range-track {
      width: 4px;
      background: transparent;
    }

    .car-sound-card .eq-band input::-moz-range-thumb {
      width: 28px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: #087e83;
      box-shadow: 0 0 0 1px #087e83, 0 2px 4px #16283129;
    }

    .car-sound-card :focus-visible {
      outline: 2px solid #087e83;
      outline-offset: 3px;
    }

    .car-sound-card button:active { background: #e4efef; }
  </style>

  <header>
    <h2>Sound settings</h2>
  </header>

  <form>
    <button type="reset" aria-label="Reset equalizer to flat">Reset</button>
    <fieldset aria-label="Equalizer">
      <h3>Equalizer</h3>
      <div class="eq-plot">
        <div class="eq-grid" aria-hidden="true"></div>
        <div class="eq-scale" aria-hidden="true">
          <span>+12 dB</span>
          <span>0 dB</span>
          <span>−12 dB</span>
        </div>
        <label class="eq-band">
          <input type="range" min="-12" max="12" step="1" value="0" orient="vertical" aria-label="60 hertz gain in decibels" aria-orientation="vertical">
          <span>60 Hz</span>
        </label>
        <label class="eq-band">
          <input type="range" min="-12" max="12" step="1" value="0" orient="vertical" aria-label="250 hertz gain in decibels" aria-orientation="vertical">
          <span>250 Hz</span>
        </label>
        <label class="eq-band">
          <input type="range" min="-12" max="12" step="1" value="0" orient="vertical" aria-label="1 kilohertz gain in decibels" aria-orientation="vertical">
          <span>1 kHz</span>
        </label>
        <label class="eq-band">
          <input type="range" min="-12" max="12" step="1" value="0" orient="vertical" aria-label="4 kilohertz gain in decibels" aria-orientation="vertical">
          <span>4 kHz</span>
        </label>
        <label class="eq-band">
          <input type="range" min="-12" max="12" step="1" value="0" orient="vertical" aria-label="12 kilohertz gain in decibels" aria-orientation="vertical">
          <span>12 kHz</span>
        </label>
      </div>
    </fieldset>
  </form>
</div>
