<div class="lk-root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
.lk-root{--bg:#f4f6f9;--card:#ffffff;--line:#e4e8ee;--ink:#111827;--mute:#6b7280;--soft:#eef2f7;--accent:#2563eb;--accent-soft:#dbe7fe;
  width:772px;height:436px;box-sizing:border-box;padding:24px;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);border-radius:20px;overflow:hidden;-webkit-font-smoothing:antialiased}
.lk-root *{box-sizing:border-box}
.lk-head{display:flex;align-items:center;justify-content:space-between;height:36px;margin-bottom:20px}
.lk-title{display:flex;align-items:center;gap:12px}
.lk-title .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lk-title h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.lk-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--mute);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px}
.lk-status i{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px #dcfce7}
.lk-body{display:grid;grid-template-columns:300px 1fr;gap:16px;height:332px}
.lk-card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.lk-child{padding:18px;display:flex;flex-direction:column}
.lk-child input{position:absolute;opacity:0;pointer-events:none}
.lk-child h3,.lk-row h3{margin:0;font-size:15px;font-weight:600}
.lk-child p,.lk-row p{margin:3px 0 0;font-size:12.5px;line-height:1.4;color:var(--mute)}
.lk-car{flex:1;display:flex;align-items:center;justify-content:center;gap:18px}
.lk-car svg{height:150px}
.lk-car .door{fill:var(--soft);stroke:#c9d1dc;stroke-width:1.5;transition:fill .2s,stroke .2s}
.lk-side{font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;width:34px;text-align:center}
#lk-l:checked~.lk-car .rl,#lk-b:checked~.lk-car .rl,#lk-r:checked~.lk-car .rr,#lk-b:checked~.lk-car .rr{fill:var(--accent);stroke:var(--accent)}
.lk-seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:10px;padding:4px;gap:4px}
.lk-seg label{height:36px;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--mute);border-radius:7px;cursor:pointer;transition:all .15s}
.lk-seg label:hover{color:var(--ink)}
#lk-o:checked~.lk-seg label[for=lk-o],#lk-l:checked~.lk-seg label[for=lk-l],#lk-r:checked~.lk-seg label[for=lk-r],#lk-b:checked~.lk-seg label[for=lk-b]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08),0 1px 6px rgba(16,24,40,.06)}
.lk-list{display:flex;flex-direction:column;padding:0 20px}
.lk-row{flex:1;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.lk-row:last-child{border-bottom:0}
.lk-row .ic{flex:none;width:40px;height:40px;border-radius:11px;background:var(--soft);color:#374151;display:grid;place-items:center}
.lk-row .tx{flex:1;min-width:0}
.lk-sw{position:relative;flex:none;width:48px;height:28px;cursor:pointer}
.lk-sw input{position:absolute;opacity:0;width:0;height:0}
.lk-sw span{position:absolute;inset:0;background:#d1d5db;border-radius:999px;transition:background .2s}
.lk-sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.lk-sw input:checked+span{background:var(--accent)}
.lk-sw input:checked+span::after{transform:translateX(20px)}
.lk-sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="lk-head">
  <div class="lk-title">
    <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h2>Locks</h2>
  </div>
  <div class="lk-status"><i></i>All doors locked</div>
</div>

<div class="lk-body">
  <div class="lk-card lk-child">
    <input type="radio" name="lk-child" id="lk-o">
    <input type="radio" name="lk-child" id="lk-l">
    <input type="radio" name="lk-child" id="lk-r">
    <input type="radio" name="lk-child" id="lk-b" checked>
    <h3>Child lock</h3>
    <p>Rear doors can’t be opened from inside</p>
    <div class="lk-car">
      <span class="lk-side">Left</span>
      <svg viewBox="0 0 110 200" aria-hidden="true">
        <rect x="15" y="6" width="80" height="188" rx="30" fill="#f8fafc" stroke="#c9d1dc" stroke-width="2"/>
        <path d="M27 58 Q55 44 83 58 L79 78 Q55 70 31 78 Z" fill="#dbe3ee"/>
        <path d="M31 150 Q55 158 79 150 L82 166 Q55 178 28 166 Z" fill="#dbe3ee"/>
        <rect x="33" y="84" width="44" height="60" rx="8" fill="#eef2f7"/>
        <rect class="door fl" x="6" y="62" width="10" height="44" rx="4"/>
        <rect class="door fr" x="94" y="62" width="10" height="44" rx="4"/>
        <rect class="door rl" x="6" y="110" width="10" height="40" rx="4"/>
        <rect class="door rr" x="94" y="110" width="10" height="40" rx="4"/>
      </svg>
      <span class="lk-side">Right</span>
    </div>
    <div class="lk-seg" role="radiogroup" aria-label="Child lock">
      <label for="lk-o">Off</label>
      <label for="lk-l">Left</label>
      <label for="lk-r">Right</label>
      <label for="lk-b">Both</label>
    </div>
  </div>

  <div class="lk-card lk-list">
    <div class="lk-row">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l6-5h10v16z"/><path d="M4 12h16"/></svg></div>
      <div class="tx"><h3>Window lock</h3><p>Disable rear passenger window switches</p></div>
      <label class="lk-sw"><input type="checkbox" checked aria-label="Window lock"><span></span></label>
    </div>
    <div class="lk-row">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v4"/><path d="M7 12l3-4 4 1 3 3"/><path d="M12 15l-1-6"/></svg></div>
      <div class="tx"><h3>Walk-away lock</h3><p>Lock automatically when the key leaves the vehicle</p></div>
      <label class="lk-sw"><input type="checkbox" checked aria-label="Walk-away lock"><span></span></label>
    </div>
    <div class="lk-row">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 17V7h3a3 3 0 0 1 0 6h-3"/></svg></div>
      <div class="tx"><h3>Unlock on park</h3><p>Unlock all doors when shifting into Park</p></div>
      <label class="lk-sw"><input type="checkbox" aria-label="Unlock on park"><span></span></label>
    </div>
  </div>
</div>
</div>
