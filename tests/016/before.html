<div class="vehicle-access" lang="en">
  <style>
    .vehicle-access {
      box-sizing: border-box;
      width: 772px;
      height: 200px;
      padding: 19px 20px 20px;
      border: 1px solid #dce2e8;
      border-radius: 20px;
      background: #f5f7fa;
      color: #19232e;
      font-family: Inter, sans-serif;
    }

    .vehicle-access *,
    .vehicle-access *::before,
    .vehicle-access *::after {
      box-sizing: border-box;
    }

    .vehicle-access h2 {
      margin: 0 0 13px;
      font-size: 20px;
      font-weight: 650;
      line-height: 24px;
      letter-spacing: -.45px;
    }

    .vehicle-access .access-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .vehicle-access .access-button {
      display: grid;
      grid-template-columns: 44px 1fr 33px;
      align-items: center;
      gap: 12px;
      height: 122px;
      padding: 16px;
      border: 1px solid #dde3e9;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 2px 3px #19232e08;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background-color 140ms, border-color 140ms;
    }

    .vehicle-access .access-button:hover {
      border-color: #a4c1fb;
      background: #f9fbff;
    }

    .vehicle-access .access-button:active {
      background: #e8efff;
    }

    .vehicle-access .access-button:focus-visible {
      outline: 3px solid #215aca;
      outline-offset: 2px;
    }

    .vehicle-access .access-icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 11px;
      background: #eaf1fe;
      color: #214e9e;
    }

    .vehicle-access .access-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .vehicle-access .access-label,
    .vehicle-access .access-action {
      display: block;
      white-space: nowrap;
    }

    .vehicle-access .access-label {
      font-size: 15px;
      font-weight: 650;
      line-height: 20px;
    }

    .vehicle-access .access-action {
      margin-top: 3px;
      color: #4e5e70;
      font-size: 13px;
      line-height: 18px;
    }

    .vehicle-access .access-arrow {
      display: grid;
      width: 33px;
      height: 33px;
      place-items: center;
      border: 1px solid #e1e7ee;
      border-radius: 50%;
      color: #334960;
      font-size: 17px;
      line-height: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .vehicle-access .access-button {
        transition: none;
      }
    }
  </style>

  <h2>Vehicle access</h2>

  <div class="access-controls" role="group" aria-label="Vehicle access controls">
    <button class="access-button" type="button" aria-label="Open frunk" data-action="open-frunk">
      <span class="access-icon" aria-hidden="true">
        <svg viewBox="0 0 28 28">
          <path d="m9 16-1.7-5.1L3 8m6 8 2.6-4.5a2 2 0 0 1 1.7-1h5.5a2 2 0 0 1 1.7 1l2.7 4.5 1.8 1.5V21H3v-2.5l2-1.5L9 16Zm0 0h14.2"/>
          <circle cx="8" cy="21" r="2.25" fill="#eaf1fe"/>
          <circle cx="21" cy="21" r="2.25" fill="#eaf1fe"/>
        </svg>
      </span>
      <span><span class="access-label">Frunk</span><span class="access-action">Open</span></span>
      <span class="access-arrow" aria-hidden="true">↗</span>
    </button>

    <button class="access-button" type="button" aria-label="Open trunk" data-action="open-trunk">
      <span class="access-icon" aria-hidden="true">
        <svg viewBox="0 0 28 28">
          <path d="m19 16 1.7-5.1L25 8m-6 8-2.6-4.5a2 2 0 0 0-1.7-1H9.2a2 2 0 0 0-1.7 1L4.8 16 3 17.5V21h22v-2.5L23 17l-4-1Zm0 0H4.8"/>
          <circle cx="7" cy="21" r="2.25" fill="#eaf1fe"/>
          <circle cx="20" cy="21" r="2.25" fill="#eaf1fe"/>
        </svg>
      </span>
      <span><span class="access-label">Trunk</span><span class="access-action">Open</span></span>
      <span class="access-arrow" aria-hidden="true">↗</span>
    </button>

    <button class="access-button" type="button" aria-label="Open charge port" data-action="open-charge-port">
      <span class="access-icon" aria-hidden="true">
        <svg viewBox="0 0 28 28">
          <rect x="4.5" y="6.5" width="19" height="15" rx="4"/>
          <path d="m15.5 9.5-4.3 5h5.6l-4.3 4.2"/>
        </svg>
      </span>
      <span><span class="access-label">Charge port</span><span class="access-action">Open</span></span>
      <span class="access-arrow" aria-hidden="true">↗</span>
    </button>
  </div>
</div>
