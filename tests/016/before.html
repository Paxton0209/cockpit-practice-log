<div class="aus-card">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    .aus-card{width:772px;height:216px;box-sizing:border-box;padding:12px 28px;background:#FFFFFF;border:1px solid #E4E7EC;border-radius:24px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);font-family:'Inter',system-ui,sans-serif;color:#101828;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    .aus-card *{box-sizing:border-box}
    .aus-row{display:flex;align-items:center;gap:20px;flex:1}
    .aus-row.top{flex:0 0 112px}
    .aus-icon{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center}
    .aus-icon.blue{background:#EAF2FF;color:#1F6FEB}
    .aus-icon.gray{background:#F2F4F7;color:#475467}
    .aus-text{flex:1;min-width:0}
    .aus-title{font-size:20px;font-weight:600;line-height:28px;letter-spacing:-.01em;margin:0}
    .aus-sub{font-size:15px;line-height:22px;color:#667085;margin:2px 0 0}
    .aus-status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#067647;margin-top:6px}
    .aus-status i{width:8px;height:8px;border-radius:50%;background:#17B26A;display:inline-block}
    .aus-divider{height:1px;background:#EAECF0;margin-left:72px}
    /* switch */
    .aus-switch{position:relative;flex:0 0 72px;height:40px;cursor:pointer}
    .aus-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
    .aus-track{position:absolute;inset:0;border-radius:999px;background:#D0D5DD;transition:background .2s ease}
    .aus-thumb{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.2),0 1px 2px rgba(16,24,40,.08);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
    .aus-switch input:checked ~ .aus-track{background:#1F6FEB}
    .aus-switch input:checked ~ .aus-thumb{transform:translateX(32px)}
    .aus-switch input:focus-visible ~ .aus-track{outline:3px solid #B2CCFF;outline-offset:2px}
    /* link row */
    .aus-link{text-decoration:none;color:inherit;border-radius:16px;margin:4px -12px 0;padding:0 12px;transition:background .15s ease}
    .aus-link:hover{background:#F9FAFB}
    .aus-link:active{background:#F2F4F7}
    .aus-link .aus-title{font-size:18px;font-weight:500}
    .aus-link .aus-sub{font-size:14px;margin-top:0}
    .aus-chev{color:#98A2B3;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500}
    .aus-chev span{color:#1F6FEB}
  </style>

  <div class="aus-row top">
    <div class="aus-icon blue">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/><path d="M12 8v5l3 2"/></svg>
    </div>
    <div class="aus-text">
      <p class="aus-title">Automatic app updates</p>
      <p class="aus-sub">Download over Wi‑Fi and install only while the vehicle is parked.</p>
      <span class="aus-status"><i></i>Up to date · Version 4.2.1</span>
    </div>
    <label class="aus-switch" aria-label="Automatic app updates">
      <input type="checkbox" role="switch" checked>
      <span class="aus-track"></span>
      <span class="aus-thumb"></span>
    </label>
  </div>

  <div class="aus-divider"></div>

  <a class="aus-row aus-link" href="#">
    <div class="aus-icon gray">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
    </div>
    <div class="aus-text">
      <p class="aus-title">User agreements</p>
      <p class="aus-sub">Terms of service, privacy notice and software licenses</p>
    </div>
    <div class="aus-chev">
      <span>View</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </div>
  </a>
</div>
