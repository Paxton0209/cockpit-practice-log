<div class="ev-range-card" role="group" aria-label="Battery range">
  <style>
    .ev-range-card,
    .ev-range-card * {
      box-sizing: border-box;
    }

    .ev-range-card {
      width: 560px;
      height: 260px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      border: 1px solid #dce4e0;
      border-radius: 24px;
      background: #f9fcfa;
      color: #142820;
      font-family: Inter, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }

    .ev-range-card__header,
    .ev-range-card__details,
    .ev-range-card__battery {
      display: flex;
      align-items: center;
    }

    .ev-range-card__header,
    .ev-range-card__details {
      justify-content: space-between;
    }

    .ev-range-card__title {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      line-height: 28px;
    }

    .ev-range-card__battery {
      gap: 9px;
      color: #176044;
      font-size: 20px;
      font-weight: 650;
      line-height: 28px;
    }

    .ev-range-card__icon {
      position: relative;
      width: 25px;
      height: 14px;
      padding: 2px;
      border: 1.5px solid currentColor;
      border-radius: 4px;
    }

    .ev-range-card__icon::before {
      content: "";
      display: block;
      width: 78%;
      height: 100%;
      border-radius: 1px;
      background: currentColor;
    }

    .ev-range-card__icon::after {
      content: "";
      position: absolute;
      top: 3px;
      right: -4px;
      width: 2px;
      height: 5px;
      border-radius: 0 2px 2px 0;
      background: currentColor;
    }

    .ev-range-card__estimate {
      margin: 0;
      line-height: 1;
      white-space: nowrap;
    }

    .ev-range-card__number {
      font-size: 76px;
      font-weight: 650;
      letter-spacing: -0.065em;
    }

    .ev-range-card__unit {
      margin-left: 7px;
      color: #496057;
      font-size: 30px;
      font-weight: 550;
    }

    .ev-range-card__charge {
      display: grid;
      gap: 10px;
      margin-top: auto;
    }

    .ev-range-card__track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #dce8e1;
    }

    .ev-range-card__fill {
      display: block;
      width: 78%;
      height: 100%;
      border-radius: inherit;
      background: #237a54;
    }

    .ev-range-card__details {
      color: #496057;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
    }
  </style>

  <header class="ev-range-card__header">
    <h2 class="ev-range-card__title">Estimated range</h2>
    <span class="ev-range-card__battery">
      <span class="ev-range-card__icon" aria-hidden="true"></span>
      <span>78%</span>
    </span>
  </header>

  <p class="ev-range-card__estimate">
    <span class="ev-range-card__number">312</span>
    <span class="ev-range-card__unit">km</span>
  </p>

  <div class="ev-range-card__charge">
    <div class="ev-range-card__track" role="meter" aria-label="Battery charge" aria-valuemin="0" aria-valuemax="100" aria-valuenow="78" aria-valuetext="78 percent">
      <span class="ev-range-card__fill"></span>
    </div>
    <div class="ev-range-card__details">
      <span>Battery charge</span>
      <span>400 km at full charge</span>
    </div>
  </div>
</div>
