<div class="nav-search">
  <style>
    .nav-search {
      box-sizing: border-box;
      width: 560px;
      height: 316px;
      padding: 16px;
      background: #f0f3f7;
      color: #172333;
      font-family: Inter, sans-serif;
    }
    .nav-search *, .nav-search *::before, .nav-search *::after {
      box-sizing: border-box;
    }
    .nav-search svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-search .search-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 16px;
      border: 1px solid #a7b8cd;
      border-radius: 14px;
      background: #fff;
      color: #40546d;
    }
    .nav-search .search-bar:focus-within {
      border-color: #225eb1;
      box-shadow: 0 0 0 2px #c7ddfa;
    }
    .nav-search input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: #172333;
      font: 600 21px/1.2 Inter, sans-serif;
    }
    .nav-search ul {
      margin: 12px 0 0;
      padding: 0;
      overflow: hidden;
      list-style: none;
      border: 1px solid #dce3ec;
      border-radius: 14px;
      background: #fff;
    }
    .nav-search li + li {
      border-top: 1px solid #e4e9f0;
    }
    .nav-search .suggestion {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 68px;
      padding: 0 16px;
      color: inherit;
      text-decoration: none;
    }
    .nav-search li:first-child .suggestion {
      background: #e7f0fc;
    }
    .nav-search .suggestion:hover {
      background: #eef4fc;
    }
    .nav-search .suggestion:focus-visible {
      outline: 2px solid #225eb1;
      outline-offset: -3px;
    }
    .nav-search .place-icon {
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      height: 40px;
      border-radius: 11px;
      background: #edf1f6;
      color: #40546d;
    }
    .nav-search li:first-child .place-icon {
      background: #d1e3fb;
      color: #174d96;
    }
    .nav-search .place {
      display: grid;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }
    .nav-search .name {
      font-size: 17px;
      font-weight: 650;
      line-height: 1.2;
    }
    .nav-search .detail, .nav-search .distance {
      color: #465973;
      font-size: 14px;
      line-height: 1.2;
    }
    .nav-search .distance {
      flex-shrink: 0;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .nav-search .chevron {
      width: 16px;
      height: 16px;
      color: #516780;
    }
  </style>

  <div class="search-bar" role="search" aria-label="Destination search">

      </a>
    </li>
  </ul>
</div>
