<div class="bt-devices">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    .bt-devices {
      box-sizing: border-box;
      width: 772px;
      height: 307px;
      padding: 24px;
      background: #F4F6F9;
      font-family: 'Inter', system-ui, sans-serif;
      color: #11161F;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .bt-devices *, .bt-devices *::before, .bt-devices *::after { box-sizing: border-box; }

    .bt-devices h2 {
      margin: 0;
      font-size: 22px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .bt-devices .bt-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 0;
    }

    .bt-devices .bt-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 24px;
      border-radius: 20px;
      border: 0;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .bt-devices .bt-card:active { transform: scale(0.985); }
    .bt-devices .bt-card:focus-visible { outline: 3px solid #2F6BFF; outline-offset: 3px; }

    /* Connected device */
    .bt-devices .bt-connected {
      background: #FFFFFF;
      box-shadow: 0 1px 2px rgba(17,22,31,.06), 0 8px 24px rgba(17,22,31,.06);
      border: 2px solid #2F6BFF;
    }

    /* Add device */
    .bt-devices .bt-add {
      background: transparent;
      border: 2px dashed #C3CAD6;
    }
    .bt-devices .bt-add:hover { background: rgba(255,255,255,.6); }

    .bt-devices .bt-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: grid;
      place-items: center;
    }
    .bt-devices .bt-connected .bt-icon { background: #2F6BFF; color: #FFFFFF; }
    .bt-devices .bt-add .bt-icon { background: #E6EAF0; color: #3A4352; }
    .bt-devices .bt-icon svg { width: 28px; height: 28px; }

    .bt-devices .bt-name {
      font-size: 26px;
      line-height: 32px;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin: 0 0 6px;
    }
    .bt-devices .bt-sub {
      font-size: 17px;
      line-height: 22px;
      font-weight: 500;
      color: #5B6576;
      margin: 0;
    }

    .bt-devices .bt-playing {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2F6BFF;
      font-weight: 600;
    }
    .bt-devices .bt-eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }
    .bt-devices .bt-eq span {
      width: 3px;
      border-radius: 2px;
      background: currentColor;
      animation: bt-eq 1s ease-in-out infinite;
    }
    .bt-devices .bt-eq span:nth-child(1) { height: 8px;  animation-delay: -0.2s; }
    .bt-devices .bt-eq span:nth-child(2) { height: 16px; animation-delay: -0.6s; }
    .bt-devices .bt-eq span:nth-child(3) { height: 11px; animation-delay: -0.4s; }
    @keyframes bt-eq {
      0%, 100% { transform: scaleY(0.4); transform-origin: bottom; }
      50%      { transform: scaleY(1);   transform-origin: bottom; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bt-devices .bt-eq span { animation: none; }
    }
  </style>

  <h2>Devices</h2>

  <div class="bt-grid">
    <button class="bt-card bt-connected" type="button" aria-label="Phone, now playing">
      <div class="bt-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2.5" width="12" height="19" rx="2.5"/>
          <line x1="10.5" y1="18" x2="13.5" y2="18"/>
        </svg>
      </div>
      <div>
        <p class="bt-name">Phone</p>
        <p class="bt-sub bt-playing">
          <span class="bt-eq" aria-hidden="true"><span></span><span></span><span></span></span>
          Now playing
        </p>
      </div>
    </button>

    <button class="bt-card bt-add" type="button" aria-label="Add device, find nearby devices">
      <div class="bt-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <div>
        <p class="bt-name">Add device</p>
        <p class="bt-sub">Find nearby devices</p>
      </div>
    </button>
  </div>
</div>
