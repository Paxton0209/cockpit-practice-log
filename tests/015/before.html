<div class="apps-panel">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
.apps-panel{
  --bg:#F4F5F7;--card:#FFFFFF;--ink:#14161A;--muted:#5F6672;--line:#E6E8EC;
  --primary:#1F5EFF;--primary-press:#1849C7;--danger:#C62828;--danger-bg:#FDECEC;
  box-sizing:border-box;width:772px;height:531px;padding:28px 32px;
  background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);
  display:flex;flex-direction:column;gap:20px;
  -webkit-font-smoothing:antialiased;
}
.apps-panel *{box-sizing:border-box;}
.apps-panel h2{margin:0;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-0.01em;}
.apps-panel ul{
  list-style:none;margin:0;padding:0 24px;flex:1;
  background:var(--card);border-radius:20px;
  box-shadow:0 1px 2px rgba(20,22,26,.06),0 4px 16px rgba(20,22,26,.04);
  display:flex;flex-direction:column;
}
.apps-panel li{
  flex:1;display:flex;align-items:center;gap:20px;
  border-bottom:1px solid var(--line);
}
.apps-panel li:last-child{border-bottom:0;}
.apps-panel .icon{
  width:56px;height:56px;border-radius:16px;flex:none;
  display:grid;place-items:center;
}
.apps-panel .icon svg{width:30px;height:30px;}
.apps-panel .phone{background:#1FA855;}
.apps-panel .maps{background:#2F7BF5;}
.apps-panel .tasks{background:#7A4DF0;}
.apps-panel .fm{background:#F0632F;}
.apps-panel .name{flex:1;font-size:22px;font-weight:600;line-height:28px;}
.apps-panel .actions{display:flex;gap:12px;}
.apps-panel button{
  font:inherit;font-size:18px;font-weight:600;height:56px;min-width:132px;padding:0 24px;
  border-radius:14px;border:0;cursor:pointer;transition:background-color .15s,transform .1s;
}
.apps-panel button:active{transform:scale(.97);}
.apps-panel button:focus-visible{outline:3px solid var(--primary);outline-offset:3px;}
.apps-panel .open{background:var(--primary);color:#fff;}
.apps-panel .open:hover{background:var(--primary-press);}
.apps-panel .uninstall{background:var(--danger-bg);color:var(--danger);}
.apps-panel .uninstall:hover{background:#FADADA;}
</style>

  <h2>Apps</h2>
  <ul>
    <li>
      <span class="icon phone" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      </span>
      <span class="name">Phone</span>
      <div class="actions">
        <button class="open" aria-label="Open Phone">Open</button>
        <button class="uninstall" aria-label="Uninstall Phone">Uninstall</button>
      </div>
    </li>
    <li>
      <span class="icon maps" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      </span>
      <span class="name">Maps</span>
      <div class="actions">
        <button class="open" aria-label="Open Maps">Open</button>
        <button class="uninstall" aria-label="Uninstall Maps">Uninstall</button>
      </div>
    </li>
    <li>
      <span class="icon tasks" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.8 1.8L9 5"/><path d="M4 13.5l1.8 1.8L9 12"/><path d="M12.5 7h7.5"/><path d="M12.5 14h7.5"/><path d="M4.5 20h15.5"/></svg>
      </span>
      <span class="name">Task master</span>
      <div class="actions">
        <button class="open" aria-label="Open Task master">Open</button>
        <button class="uninstall" aria-label="Uninstall Task master">Uninstall</button>
      </div>
    </li>
    <li>
      <span class="icon fm" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l12-5"/><rect x="3" y="8" width="18" height="13" rx="2.5"/><circle cx="15.5" cy="14.5" r="2.8"/><path d="M6.5 12.5h4"/><path d="M6.5 16.5h4"/></svg>
      </span>
      <span class="name">FM</span>
      <div class="actions">
        <button class="open" aria-label="Open FM">Open</button>
        <button class="uninstall" aria-label="Uninstall FM">Uninstall</button>
      </div>
    </li>
  </ul>
</div>
