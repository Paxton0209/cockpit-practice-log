<div class="vc-access">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');
    .vc-access{
      width:772px;height:156px;box-sizing:border-box;
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
      font-family:'Inter',system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .vc-access *{box-sizing:border-box;}
    .vc-access button{
      all:unset;box-sizing:border-box;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
      height:156px;border-radius:20px;
      background:#FFFFFF;border:1px solid #E4E7EC;
      box-shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
      color:#111827;
      transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .1s ease;
    }
    .vc-access button:hover{border-color:#CBD2DC;box-shadow:0 2px 4px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);}
    .vc-access button:active{transform:scale(.985);background:#F7F8FA;}
    .vc-access button:focus-visible{outline:none;border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.25);}
    .vc-access .ic{
      width:60px;height:60px;border-radius:50%;
      display:grid;place-items:center;
      background:#F1F3F6;color:#1F2937;
      transition:background .15s ease,color .15s ease;
    }
    .vc-access button:hover .ic{background:#E8ECF2;}
    .vc-access svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .vc-access .lbl{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1;}
  </style>

  <button type="button" aria-label="Open frunk">
    <span class="ic">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 22H3.5v-5l3-2 4-4h8.5l4 4"/>
        <path d="M23 16.5h5a1 1 0 0 1 1 1V22h-2.5"/>
        <path d="M11 22h10.5"/>
        <path d="M23 15l5-5.5"/>
        <circle cx="8.5" cy="22" r="2.5"/>
        <circle cx="24" cy="22" r="2.5"/>
      </svg>
    </span>
    <span class="lbl">Frunk</span>
  </button>

  <button type="button" aria-label="Open trunk">
    <span class="ic">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M26 22h2.5v-4.5a1 1 0 0 0-1-1H23l-4-4.5h-8.5L7 15"/>
        <path d="M7 16.5H4a1 1 0 0 0-1 1V22h2.5"/>
        <path d="M10.5 22H21"/>
        <path d="M7 15L2.5 10"/>
        <circle cx="8" cy="22" r="2.5"/>
        <circle cx="23.5" cy="22" r="2.5"/>
      </svg>
    </span>
    <span class="lbl">Trunk</span>
  </button>

  <button type="button" aria-label="Open charge port">
    <span class="ic">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="7" y="9" width="14" height="17" rx="3"/>
        <path d="M11 9V5.5M17 9V5.5"/>
        <path d="M15 13l-3 4.5h4l-3 4.5"/>
        <path d="M21 18h3a2 2 0 0 0 2-2v-4.5"/>
      </svg>
    </span>
    <span class="lbl">Charge port</span>
  </button>
</div>
