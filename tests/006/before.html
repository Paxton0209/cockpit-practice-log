<div class="openings">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');
    .openings{
      --bg:#F5F6F8; --tile:#FFFFFF; --ink:#14161A; --muted:#5B6270;
      --line:#E3E6EB; --accent:#1F6FEB; --accent-soft:#EAF1FD;
      box-sizing:border-box; width:772px; height:200px; padding:24px;
      background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--ink);
      display:flex; flex-direction:column; gap:16px;
    }
    .openings *{box-sizing:border-box}
    .openings h2{margin:0; font-size:18px; line-height:24px; font-weight:600; letter-spacing:-0.01em}
    .openings .row{flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
    .openings button{
      all:unset; box-sizing:border-box; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
      background:var(--tile); border:1px solid var(--line); border-radius:16px;
      box-shadow:0 1px 2px rgba(20,22,26,.04);
      transition:background .15s, border-color .15s, box-shadow .15s, transform .1s;
    }
    .openings button:hover{border-color:#CBD1DA; box-shadow:0 2px 8px rgba(20,22,26,.06)}
    .openings button:active{transform:scale(.98); background:var(--accent-soft); border-color:var(--accent)}
    .openings button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
    .openings .well{
      width:48px; height:48px; border-radius:50%; background:var(--bg);
      display:grid; place-items:center; color:var(--ink);
    }
    .openings button:active .well{background:#fff}
    .openings svg{width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
    .openings svg .lift{stroke:var(--accent); stroke-width:2}
    .openings .label{font-size:15px; line-height:20px; font-weight:500}
  </style>

  <h2>Openings</h2>
  <div class="row">
    <button type="button" aria-label="Open frunk">
      <span class="well">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.5 12H2v5h2M10 17h4M20 17h2v-4l-3-1-3-3.5h-5L8.5 12"/>
          <path class="lift" d="M8.5 12L3.5 8.5"/>
          <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
        </svg>
      </span>
      <span class="label">Frunk</span>
    </button>

    <button type="button" aria-label="Open trunk">
      <span class="well">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 12H22v5h-2M14 17h-4M4 17H2v-4l3-1 3-3.5h5l2.5 3.5"/>
          <path class="lift" d="M15.5 12l5-3.5"/>
          <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
        </svg>
      </span>
      <span class="label">Trunk</span>
    </button>

    <button type="button" aria-label="Open charge port">
      <span class="well">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 3v4M15 3v4"/>
          <path d="M6 7h12v4a6 6 0 0 1-12 0V7z"/>
          <path d="M12 17v4"/>
          <path class="lift" d="M12.6 9.5l-2.1 3h3l-2.1 3"/>
        </svg>
      </span>
      <span class="label">Charge port</span>
    </button>
  </div>
</div>
