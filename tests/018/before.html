<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistant thinking</title>
<style>
  html, body { margin: 0; background: transparent; }
  * { box-sizing: border-box; }
  .bar {
    position: absolute; top: 0; left: 0;
    width: 412px; height: 72px;
    border-radius: 36px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F6F7FA 100%);
    border: 1px solid #E3E6EC;
    box-shadow: inset 0 1px 0 #FFFFFF;
    display: flex; align-items: center;
    padding: 0 24px 0 14px; gap: 14px;
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }
  /* Orb */
  .orb {
    position: relative; flex: none;
    width: 44px; height: 44px; border-radius: 50%;
    background: #EEF1FF;
    overflow: hidden;
    isolation: isolate;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .orb::before {
    content: ""; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg, #4F6BFF, #8E7CFF, #22C1C3, #4F6BFF);
    filter: blur(6px);
    animation: spin 3.2s linear infinite;
  }
  .orb::after {
    content: ""; position: absolute; inset: 7px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #FFFFFF 0%, rgba(255,255,255,.85) 40%, rgba(255,255,255,0) 75%);
    animation: core 2.4s ease-in-out infinite;
  }
  .ring {
    position: absolute; left: 14px; top: 13px;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid rgba(79,107,255,.35);
    animation: ripple 2.4s ease-out infinite;
    pointer-events: none;
  }
  .text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #5B6BE0;
    display: flex; align-items: center; gap: 6px;
  }
  .dots { display: inline-flex; gap: 3px; }
  .dots i {
    width: 4px; height: 4px; border-radius: 50%; background: #5B6BE0;
    animation: dot 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .main {
    font-size: 18px; font-weight: 600; letter-spacing: -.01em;
    white-space: nowrap;
    color: #1A1F2C;
    background: linear-gradient(90deg, #1A1F2C 0%, #1A1F2C 40%, #8C9BFF 50%, #1A1F2C 60%, #1A1F2C 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 2.4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(.94); } }
  @keyframes core { 0%,100% { opacity: .95; transform: scale(1); } 50% { opacity: .7; transform: scale(.85); } }
  @keyframes ripple {
    0% { transform: scale(1); opacity: .9; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  @keyframes dot { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .orb, .orb::before, .orb::after, .ring, .dots i, .main { animation: none; }
    .main { -webkit-text-fill-color: #1A1F2C; }
  }
</style>
</head>
<body>
  <div class="bar" role="status" aria-live="polite" aria-label="Assistant is thinking: Analyzing target restaurant">
    <div class="orb" aria-hidden="true"></div>
    <div class="ring" aria-hidden="true"></div>
    <div class="text">
      <div class="label">Thinking <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div class="main">Analyzing target restaurant</div>
    </div>
  </div>
</body>
</html>
