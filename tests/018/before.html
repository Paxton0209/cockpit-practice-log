<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistant thinking</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  * { box-sizing: border-box; }
  .card {
    position: relative;
    width: 386px; height: 72px;
    border-radius: 36px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F6F8FB 100%);
    box-shadow: inset 0 0 0 1px rgba(20, 32, 54, 0.08), inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex; align-items: center;
    padding: 0 24px 0 14px;
    gap: 14px;
    overflow: hidden;
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* soft travelling glow across the card */
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120px 60px at var(--gx, 20%) 50%, rgba(76, 120, 255, 0.10), transparent 70%);
    animation: glow 4.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glow {
    0%, 100% { --gx: 12%; opacity: .9; }
    50% { --gx: 70%; opacity: .5; }
  }
  @property --gx { syntax: "<percentage>"; inherits: false; initial-value: 12%; }

  /* Orb */
  .orb {
    position: relative; flex: none;
    width: 44px; height: 44px;
  }
  .orb .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #3D6BFF, #8A5CFF, #22C1E6, #3D6BFF);
    -webkit-mask: radial-gradient(circle, transparent 18px, #000 18.5px, #000 22px, transparent 22.5px);
            mask: radial-gradient(circle, transparent 18px, #000 18.5px, #000 22px, transparent 22.5px);
    animation: spin 2.4s linear infinite;
    opacity: .9;
  }
  .orb .core {
    position: absolute; inset: 7px; border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.95) 0 18%, transparent 45%),
      radial-gradient(circle at 70% 75%, #22C1E6 0%, transparent 60%),
      radial-gradient(circle at 30% 70%, #8A5CFF 0%, transparent 65%),
      #3D6BFF;
    animation: breathe 1.6s ease-in-out infinite, hue 6s linear infinite;
    box-shadow: 0 0 0 0 rgba(61,107,255,.35);
  }
  .orb .blob {
    position: absolute; inset: 7px; border-radius: 50%; overflow: hidden;
    mix-blend-mode: screen;
  }
  .orb .blob::before, .orb .blob::after {
    content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
    filter: blur(4px);
  }
  .orb .blob::before { background: rgba(120, 220, 255, .85); left: -4px; top: 4px; animation: orbitA 3s ease-in-out infinite; }
  .orb .blob::after  { background: rgba(190, 140, 255, .8); right: -4px; bottom: 2px; animation: orbitB 3.4s ease-in-out infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe {
    0%, 100% { transform: scale(.92); box-shadow: 0 0 0 0 rgba(61,107,255,.30); }
    50% { transform: scale(1); box-shadow: 0 0 0 5px rgba(61,107,255,0); }
  }
  @keyframes hue { 0%,100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(-25deg); } }
  @keyframes orbitA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px, 8px); } }
  @keyframes orbitB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-12px, -10px); } }

  /* Text */
  .text { position: relative; display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: #6B778C; display: flex; align-items: center; gap: 6px;
  }
  .dots { display: inline-flex; gap: 3px; }
  .dots i {
    width: 4px; height: 4px; border-radius: 50%; background: #3D6BFF;
    animation: dot 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot {
    0%, 80%, 100% { opacity: .25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }
  .task {
    font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 22px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(90deg, #141B2D 0%, #141B2D 40%, #6F8CFF 50%, #141B2D 60%, #141B2D 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shimmer 2.2s linear infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }

  /* Thin indeterminate progress along the bottom edge */
  .progress {
    position: absolute; left: 36px; right: 36px; bottom: 0; height: 2px;
    overflow: hidden; border-radius: 2px;
  }
  .progress::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 30%;
    background: linear-gradient(90deg, transparent, #3D6BFF, #8A5CFF, transparent);
    animation: sweep 1.8s cubic-bezier(.45,0,.25,1) infinite;
  }
  @keyframes sweep { from { left: -30%; } to { left: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 6s !important; }
    .task { animation: none; color: #141B2D; background: none; }
    .progress::after { animation: none; left: 35%; }
  }
</style>
</head>
<body>
  <div class="card" role="status" aria-live="polite" aria-label="Assistant is thinking: Analyzing target restaurant">
    <div class="orb" aria-hidden="true">
      <div class="ring"></div>
      <div class="core"></div>
      <div class="blob"></div>
    </div>
    <div class="text">
      <div class="label">Thinking <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div class="task">Analyzing target restaurant</div>
    </div>
    <div class="progress" aria-hidden="true"></div>
  </div>
</body>
</html>
