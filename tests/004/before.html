<div class="apps-root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
.apps-root{width:772px;height:480px;box-sizing:border-box;padding:20px;background:#F3F4F6;font-family:'Inter',system-ui,sans-serif;color:#111827;display:flex;flex-direction:column;gap:12px}
.apps-root *{box-sizing:border-box}
.apps-root .row{flex:1;display:flex;align-items:center;gap:20px;padding:0 20px 0 18px;background:#FFFFFF;border-radius:20px;box-shadow:0 1px 2px rgba(17,24,39,.06),0 0 0 1px rgba(17,24,39,.05)}
.apps-root .icon{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.apps-root .icon svg{width:32px;height:32px}
.apps-root .phone{background:linear-gradient(160deg,#34D399,#059669)}
.apps-root .maps{background:linear-gradient(160deg,#60A5FA,#2563EB)}
.apps-root .task{background:linear-gradient(160deg,#FBBF24,#EA580C)}
.apps-root .fm{background:linear-gradient(160deg,#A78BFA,#7C3AED)}
.apps-root .name{flex:1;font-size:22px;font-weight:600;letter-spacing:-.01em}
.apps-root .actions{display:flex;gap:12px}
.apps-root button{font-family:inherit;font-size:18px;font-weight:600;height:56px;min-width:136px;padding:0 24px;border-radius:14px;border:none;cursor:pointer;transition:background .15s,transform .1s}
.apps-root button:active{transform:scale(.97)}
.apps-root .open{background:#111827;color:#FFFFFF}
.apps-root .open:hover{background:#1F2937}
.apps-root .uninstall{background:#FEF2F2;color:#DC2626}
.apps-root .uninstall:hover{background:#FEE2E2}
.apps-root button:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
</style>

<div class="row">
  <div class="icon phone"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div>
  <div class="name">Phone</div>
  <div class="actions"><button class="open" aria-label="Open Phone">Open</button><button class="uninstall" aria-label="Uninstall Phone">Uninstall</button></div>
</div>

<div class="row">
  <div class="icon maps"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></div>
  <div class="name">Maps</div>
  <div class="actions"><button class="open" aria-label="Open Maps">Open</button><button class="uninstall" aria-label="Uninstall Maps">Uninstall</button></div>
</div>

<div class="row">
  <div class="icon task"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.8 1.8L9 5"/><path d="M4 13.5l1.8 1.8L9 12"/><path d="M12.5 7h7.5"/><path d="M12.5 14h7.5"/><path d="M4.5 19.5h.01"/><path d="M12.5 19.5h7.5"/></svg></div>
  <div class="name">Task master</div>
  <div class="actions"><button class="open" aria-label="Open Task master">Open</button><button class="uninstall" aria-label="Uninstall Task master">Uninstall</button></div>
</div>

<div class="row">
  <div class="icon fm"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="#fff" stroke="none"/><path d="M8.5 15.5a5 5 0 0 1 0-7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.6 18.4a9 9 0 0 1 0-12.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg></div>
  <div class="name">FM</div>
  <div class="actions"><button class="open" aria-label="Open FM">Open</button><button class="uninstall" aria-label="Uninstall FM">Uninstall</button></div>
</div>
</div>
