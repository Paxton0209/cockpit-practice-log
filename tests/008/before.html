<div class="cd-root" role="dialog" aria-modal="true" aria-labelledby="cd-title" aria-describedby="cd-desc">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    .cd-root {
      --cd-surface: #FFFFFF;
      --cd-text: #14171C;
      --cd-text-muted: #4A5260;
      --cd-primary: #1F5EFF;
      --cd-primary-pressed: #1849CC;
      --cd-secondary: #EDEFF3;
      --cd-secondary-pressed: #DCE0E7;
      --cd-focus: #1F5EFF;

      box-sizing: border-box;
      position: relative;
      width: 672px;
      height: 320px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      background: var(--cd-surface);
      border-radius: 28px;
      box-shadow: 0 2px 6px rgba(20, 23, 28, 0.06), 0 16px 40px rgba(20, 23, 28, 0.14);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--cd-text);
      -webkit-font-smoothing: antialiased;
    }
    .cd-root *, .cd-root *::before, .cd-root *::after { box-sizing: border-box; }

    .cd-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--cd-text-muted);
      cursor: pointer;
      transition: background-color 120ms ease;
    }
    .cd-close:active { background: var(--cd-secondary); }
    .cd-close svg { width: 28px; height: 28px; }

    .cd-title {
      margin: 0;
      padding-right: 64px;
      font-size: 32px;
      line-height: 40px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .cd-desc {
      margin: 12px 0 0;
      padding-right: 64px;
      font-size: 24px;
      line-height: 32px;
      font-weight: 400;
      color: var(--cd-text-muted);
    }

    .cd-actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .cd-btn {
      height: 80px;
      border: 0;
      border-radius: 20px;
      font-family: inherit;
      font-size: 26px;
      line-height: 1;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 120ms ease, transform 120ms ease;
    }
    .cd-btn:active { transform: scale(0.98); }

    .cd-btn--primary { background: var(--cd-primary); color: #FFFFFF; }
    .cd-btn--primary:active { background: var(--cd-primary-pressed); }

    .cd-btn--secondary { background: var(--cd-secondary); color: var(--cd-text); }
    .cd-btn--secondary:active { background: var(--cd-secondary-pressed); }

    .cd-close:focus-visible,
    .cd-btn:focus-visible {
      outline: 4px solid var(--cd-focus);
      outline-offset: 3px;
    }
  </style>

  <button class="cd-close" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>

  <h2 class="cd-title" id="cd-title">Dialog title</h2>
  <p class="cd-desc" id="cd-desc">One or two lines that explain what happens next.</p>

  <div class="cd-actions">
    <button class="cd-btn cd-btn--primary" type="button">Confirm</button>
    <button class="cd-btn cd-btn--secondary" type="button">Cancel</button>
  </div>
</div>
