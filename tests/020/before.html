<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistant suggestion</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 548px; height: 72px; overflow: hidden; }

  .card {
    position: absolute; top: 0; left: 0; height: 72px; width: 72px;
    box-sizing: border-box; border-radius: 36px;
    background: linear-gradient(180deg, #ffffff 0%, #f7f8fb 100%);
    border: 1px solid rgba(20, 30, 60, 0.08);
    box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(20,30,60,0.03);
    overflow: hidden;
    transition: width 700ms cubic-bezier(.2,.9,.25,1), opacity 400ms ease;
    opacity: 0;
  }
  .card.in { opacity: 1; }
  .card.open { width: 548px; }

  /* Orb */
  .orb {
    position: absolute; left: 13px; top: 13px; width: 44px; height: 44px; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 30%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,0) 38%),
      conic-gradient(from 0deg, #5b8cff, #7a5cff, #3fc6ff, #5be0c2, #5b8cff);
    box-shadow: 0 4px 14px rgba(91,120,255,.28);
    transform: scale(.4); opacity: 0;
    transition: transform 600ms cubic-bezier(.3,1.5,.5,1), opacity 300ms ease;
  }
  .card.in .orb { transform: scale(1); opacity: 1; }
  .orb::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: inherit; filter: blur(0); animation: spin 6s linear infinite;
  }
  .orb::after {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffffff, rgba(255,255,255,.55) 55%, rgba(255,255,255,0) 72%);
    opacity: .75;
  }
  .orb .ring {
    position: absolute; inset: -5px; border-radius: 50%;
    border: 2px solid rgba(110,130,255,.35); opacity: 0;
  }
  .speaking .orb { animation: talk 420ms ease-in-out infinite alternate; }
  .speaking .orb .ring { animation: ripple 1.2s ease-out infinite; }
  .speaking .orb .ring.r2 { animation-delay: .6s; }
  .listening .orb { animation: breathe 2.4s ease-in-out infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes talk { from { transform: scale(.96); } to { transform: scale(1.06); } }
  @keyframes breathe { 0%,100% { transform: scale(.97); } 50% { transform: scale(1.02); } }
  @keyframes ripple { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }

  /* Text */
  .text {
    position: absolute; left: 72px; top: 0; height: 72px; right: 96px;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    white-space: nowrap;
  }
  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: #6a74e8; opacity: 0; transform: translateY(4px);
    transition: opacity 400ms ease, transform 400ms ease;
    display: flex; align-items: center; gap: 6px;
  }
  .eyebrow svg { width: 12px; height: 12px; }
  .card.open .eyebrow { opacity: 1; transform: none; transition-delay: 350ms; }
  .q { font-size: 18px; font-weight: 600; color: #141a2e; letter-spacing: -0.01em; line-height: 24px; }
  .q span {
    display: inline-block; opacity: 0; transform: translateY(6px); filter: blur(3px);
    transition: opacity 260ms ease, transform 320ms cubic-bezier(.2,.9,.3,1), filter 260ms ease;
  }
  .q span.on { opacity: 1; transform: none; filter: none; }

  /* Listening indicator */
  .listen {
    position: absolute; right: 13px; top: 13px; width: 72px; height: 44px; border-radius: 22px;
    background: #eef1ff; display: flex; align-items: center; justify-content: center; gap: 3px;
    opacity: 0; transform: scale(.85);
    transition: opacity 400ms ease, transform 500ms cubic-bezier(.3,1.4,.5,1), background 400ms;
  }
  .listening .listen { opacity: 1; transform: none; }
  .listen i {
    display: block; width: 3px; height: 6px; border-radius: 2px; background: #5b6cf0;
  }
  .listening .listen i { animation: bar 1.1s ease-in-out infinite; }
  .listen i:nth-child(1) { animation-delay: 0s; }
  .listen i:nth-child(2) { animation-delay: .15s; }
  .listen i:nth-child(3) { animation-delay: .3s; }
  .listen i:nth-child(4) { animation-delay: .45s; }
  .listen i:nth-child(5) { animation-delay: .6s; }
  @keyframes bar { 0%,100% { height: 5px; opacity: .55; } 50% { height: 16px; opacity: 1; } }
  .listen .mic { width: 14px; height: 14px; margin-right: 5px; color: #5b6cf0; }

  /* waiting timer line */
  .timer {
    position: absolute; left: 36px; right: 36px; bottom: 0; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, #7a8cff, #4fc8ff); transform-origin: left center;
    transform: scaleX(0); opacity: 0;
  }
  .listening .timer { opacity: .7; animation: wait 7s linear forwards; }
  @keyframes wait { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  .card.out { opacity: 0; transition: opacity 500ms ease, width 600ms ease; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage" role="status" aria-live="polite">
  <div class="card" id="card">
    <div class="orb"><div class="ring"></div><div class="ring r2"></div></div>
    <div class="text">
      <div class="eyebrow">
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 1l1.2 3.3L10.5 5.5 7.2 6.7 6 10 4.8 6.7 1.5 5.5 4.8 4.3z" fill="currentColor"/></svg>
        Suggestion
      </div>
      <div class="q" id="q" aria-label="Would you like to open the windows?"></div>
    </div>
    <div class="listen" aria-hidden="true">
      <svg class="mic" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" fill="currentColor"/><path d="M3 8a5 5 0 0 0 10 0M8 13v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="timer"></div>
  </div>
</div>
<script>
(function () {
  var card = document.getElementById('card');
  var q = document.getElementById('q');
  var words = 'Would you like to open the windows?'.split(' ');
  var timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function build() {
    q.innerHTML = '';
    words.forEach(function (w, i) {
      var s = document.createElement('span');
      s.textContent = w;
      q.appendChild(s);
      if (i < words.length - 1) q.appendChild(document.createTextNode(' '));
    });
  }

  function run() {
    timers.forEach(clearTimeout); timers = [];
    build();
    card.className = 'card';
    void card.offsetWidth;
    at(100, function () { card.classList.add('in'); });
    at(650, function () { card.classList.add('open'); });
    at(1050, function () { card.classList.add('speaking'); });
    var spans = q.querySelectorAll('span');
    spans.forEach(function (s, i) {
      at(1150 + i * 210, function () { s.classList.add('on'); });
    });
    var spokenEnd = 1150 + spans.length * 210 + 250;
    at(spokenEnd, function () {
      card.classList.remove('speaking');
      card.classList.add('listening');
    });
    at(spokenEnd + 7000, function () {
      card.classList.remove('listening');
      card.classList.add('out');
      card.classList.remove('open');
    });
    at(spokenEnd + 8200, run);
  }
  run();
})();
</script>
</body>
</html>
