<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice assistant – user speech bar</title>
<style>
  html, body { margin: 0; background: transparent; }
  * { box-sizing: border-box; }
  .bar {
    position: absolute; left: 0; top: 0;
    width: 548px; height: 72px;
    border-radius: 36px;
    background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
    border: 1px solid #e3e8ef;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    font-family: Inter, system-ui, sans-serif;
    display: flex; align-items: center;
    padding: 0 22px 0 12px;
    overflow: hidden;
    opacity: 0; transform: translateY(6px);
    transition: opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .bar.show { opacity: 1; transform: none; }

  .avatar-wrap { position: relative; width: 48px; height: 48px; flex: 0 0 48px; }
  .ring {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid #3b82f6; opacity: 0;
    transform: scale(var(--s, 1));
    transition: transform .12s ease-out, opacity .3s ease;
  }
  .bar.listening .ring { opacity: .55; }
  .halo {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(59,130,246,.18); opacity: 0;
  }
  .bar.listening .halo { animation: halo 1.6s ease-out infinite; }
  @keyframes halo { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }
  .avatar {
    position: relative; width: 48px; height: 48px; border-radius: 50%;
    overflow: hidden; background: linear-gradient(145deg, #dbe7fb, #b9cdee);
    box-shadow: 0 0 0 2px #fff;
  }
  .avatar svg { display: block; }

  .text-wrap {
    position: relative; margin-left: 16px; flex: 1;
    height: 44px; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 6px, #000 100%);
            mask-image: linear-gradient(180deg, transparent 0, #000 6px, #000 100%);
  }
  .text {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 15px; line-height: 22px; font-weight: 500;
    color: #0f172a; letter-spacing: -0.005em;
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .w {
    display: inline; opacity: 0; color: #94a3b8;
    filter: blur(3px);
    transition: opacity .25s ease, filter .3s ease, color .6s ease;
  }
  .w.in { opacity: 1; filter: blur(0); }
  .w.final { color: #0f172a; }
  .w.hl.final { color: #2563eb; }
  .caret {
    display: inline-block; width: 2px; height: 16px; margin-left: 3px;
    vertical-align: -2px; border-radius: 1px; background: #3b82f6;
    animation: blink 1s steps(2, start) infinite;
  }
  .bar.done .caret { opacity: 0; animation: none; }
  @keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>
<div class="bar" id="bar" role="status" aria-live="polite" aria-label="Driver speech">
  <div class="avatar-wrap">
    <div class="halo"></div>
    <div class="ring" id="ring"></div>
    <div class="avatar" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <path d="M14 15c0-6 4.6-9.5 10.2-9.5 5.8 0 10 3.6 10 9.6v3H14z" fill="#3b2f2a"/>
        <circle cx="24" cy="19.5" r="8.2" fill="#f2c7a5"/>
        <path d="M15.6 17c2.5-.2 6.4-1.6 8.6-4.6 1.6 2.6 5 4.3 8.2 4.6-.3-5.4-3.8-8.4-8.2-8.4-4.6 0-8.3 3-8.6 8.4z" fill="#3b2f2a"/>
        <rect x="21" y="26" width="6" height="5" rx="2" fill="#e6b592"/>
        <path d="M8 48c0-9.2 7-15.6 16-15.6S40 38.8 40 48z" fill="#2563eb"/>
        <path d="M20 32.6 24 37l4-4.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/>
      </svg>
    </div>
  </div>
  <div class="text-wrap">
    <div class="text" id="text"></div>
  </div>
</div>
<script>
(function () {
  var phrase = "Open all the windows and lower the rear windows halfway. Then set the cabin to 22° and turn on the seat heater.";
  var highlight = { "22°": 1 };
  var bar = document.getElementById('bar');
  var text = document.getElementById('text');
  var ring = document.getElementById('ring');
  var timers = [], raf = 0;

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function pulse(t0) {
    function step(t) {
      var v = 1 + 0.06 * Math.abs(Math.sin((t - t0) / 90)) + 0.04 * Math.abs(Math.sin((t - t0) / 37));
      ring.style.setProperty('--s', v.toFixed(3));
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  function run() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(raf);
    text.innerHTML = '';
    text.style.transform = 'translateY(0)';
    bar.className = 'bar';
    var words = phrase.split(' ');
    var spans = words.map(function (w, i) {
      var s = document.createElement('span');
      s.className = 'w' + (highlight[w.replace(/[.,]$/, '')] ? ' hl' : '');
      s.textContent = w + (i < words.length - 1 ? ' ' : '');
      text.appendChild(s);
      return s;
    });
    var caret = document.createElement('span');
    caret.className = 'caret';
    text.appendChild(caret);

    later(function () { bar.classList.add('show'); }, 50);
    later(function () { bar.classList.add('listening'); pulse(performance.now()); }, 400);

    var t = 700;
    spans.forEach(function (s, i) {
      var w = words[i];
      t += 140 + w.length * 22 + (/[.]$/.test(words[i - 1] || '') ? 320 : 0);
      (function (s, at) {
        later(function () {
          text.insertBefore(caret, s.nextSibling);
          s.classList.add('in');
          var over = text.offsetHeight - 44;
          text.style.transform = over > 0 ? '' : 'translateY(0)';
        }, at);
        later(function () { s.classList.add('final'); }, at + 450);
      })(s, t);
    });

    later(function () {
      bar.classList.remove('listening');
      bar.classList.add('done');
      cancelAnimationFrame(raf);
      ring.style.setProperty('--s', '1');
    }, t + 600);
    later(function () { bar.classList.remove('show'); }, t + 3600);
    later(run, t + 4300);
  }
  run();
})();
</script>
</body>
</html>
