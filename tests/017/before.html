<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice Assistant Bar</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  * { box-sizing: border-box; }
  .bar {
    position: absolute; left: 0; top: 0;
    width: 840px; height: 72px;
    border-radius: 36px;
    background: linear-gradient(180deg, #ffffff 0%, #f6f7f9 100%);
    border: 1px solid rgba(17, 24, 39, 0.08);
    box-shadow: 0 1px 2px rgba(17,24,39,0.06), 0 8px 24px -12px rgba(17,24,39,0.18);
    font-family: Inter, system-ui, sans-serif;
    color: #111827;
    overflow: hidden;
    display: flex; align-items: center;
    padding: 0 28px 0 12px;
  }
  /* Orb */
  .orb {
    position: relative; flex: 0 0 48px; width: 48px; height: 48px;
    border-radius: 50%;
    display: grid; place-items: center;
  }
  .orb .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #2563eb, #06b6d4, #8b5cf6, #2563eb);
    opacity: 0; transition: opacity .4s ease;
    -webkit-mask: radial-gradient(circle, transparent 20px, #000 21px);
            mask: radial-gradient(circle, transparent 20px, #000 21px);
  }
  .orb .core {
    position: absolute; inset: 4px; border-radius: 50%;
    background: #eef2ff;
    transition: background .4s ease, transform .4s ease;
  }
  .bars { position: relative; display: flex; gap: 3px; align-items: center; height: 20px; transition: opacity .3s ease; }
  .bars i {
    display: block; width: 3px; height: 6px; border-radius: 2px; background: #2563eb;
    transition: height .09s linear;
  }
  .dots { position: absolute; display: flex; gap: 4px; opacity: 0; transition: opacity .3s ease; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: dot 1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%,100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-4px); opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .orb.listening .core { background: #eef2ff; }
  .orb.thinking .ring { opacity: 1; animation: spin 1.1s linear infinite; }
  .orb.thinking .core { background: linear-gradient(135deg, #2563eb, #7c3aed); transform: scale(.86); }
  .orb.thinking .bars { opacity: 0; }
  .orb.thinking .dots { opacity: 1; }
  .orb.speaking .core { background: linear-gradient(135deg, #2563eb, #06b6d4); }
  .orb.speaking .bars i { background: #fff; }
  .orb.idle .bars i { background: #9ca3af; }

  /* Text */
  .content { position: relative; flex: 1; height: 100%; margin-left: 16px; }
  .line {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(calc(-50% + 8px));
    opacity: 0;
    transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1);
    white-space: nowrap;
  }
  .line.show { opacity: 1; transform: translateY(-50%); }
  .line.out { opacity: 0; transform: translateY(calc(-50% - 8px)); }
  .label {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #6b7280; margin-bottom: 3px;
  }
  .label.ai { color: #2563eb; }
  .text { font-size: 20px; font-weight: 500; letter-spacing: -0.01em; line-height: 26px; }
  .user .text .w { opacity: 0; transition: opacity .18s ease; }
  .user .text .w.on { opacity: 1; }
  .user .text .w.on.pending { color: #9ca3af; }
  .thinking-text { font-size: 20px; font-weight: 500; color: #6b7280; }
  .shimmer {
    background: linear-gradient(90deg, #9ca3af 0%, #9ca3af 40%, #111827 50%, #9ca3af 60%, #9ca3af 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shim 1.6s linear infinite;
  }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .reply .text .ok {
    display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
    background: #dcfce7; color: #16a34a; margin-right: 8px; vertical-align: -3px;
  }
  .reply .sub { font-size: 20px; font-weight: 600; color: #111827; }
  .reply .done { font-size: 13px; color: #6b7280; font-weight: 500; }
  .ask .text { font-weight: 600; }
  .ask .prev { font-size: 13px; color: #6b7280; font-weight: 500; display: block; margin-bottom: 2px; }
  .ask .prev .ok { color: #16a34a; margin-right: 4px; }
</style>
</head>
<body>
<div class="bar" role="status" aria-live="polite">
  <div class="orb idle" id="orb">
    <div class="ring"></div>
    <div class="core"></div>
    <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <div class="content">
    <div class="line user" id="lUser">
      <span class="label">You</span>
      <span class="text" id="userText"></span>
    </div>
    <div class="line" id="lThink">
      <span class="label ai">Assistant</span>
      <span class="thinking-text shimmer">Thinking…</span>
    </div>
    <div class="line reply" id="lReply">
      <span class="label ai">Assistant</span>
      <span class="text"><span class="ok"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="sub">Rear windows halfway, cabin at 22°.</span></span>
    </div>
    <div class="line ask" id="lAsk">
      <span class="prev"><span class="ok">✓</span>Rear windows halfway, cabin at 22°.</span>
      <span class="text">Open the front windows too?</span>
    </div>
  </div>
</div>
<script>
(function () {
  const orb = document.getElementById('orb');
  const barEls = Array.from(document.querySelectorAll('#bars i'));
  const userText = document.getElementById('userText');
  const L = {
    user: document.getElementById('lUser'),
    think: document.getElementById('lThink'),
    reply: document.getElementById('lReply'),
    ask: document.getElementById('lAsk')
  };
  const phrase = 'Open the rear windows halfway and set the cabin to 22°';
  const words = phrase.split(' ');
  userText.innerHTML = words.map(w => '<span class="w">' + w + '</span>').join(' ');
  const wEls = Array.from(userText.querySelectorAll('.w'));

  let level = 0; // waveform amplitude 0..1
  let mode = 'idle';
  let t = 0;
  function wave() {
    t += 1;
    barEls.forEach((b, i) => {
      let h;
      if (mode === 'idle') h = 4 + Math.sin(t / 12 + i) * 1;
      else {
        const n = Math.abs(Math.sin(t / 5 + i * 1.3) * Math.sin(t / 9 + i * .7));
        h = 4 + level * (6 + n * 14) * (i === 2 ? 1 : i === 1 || i === 3 ? .8 : .55);
      }
      b.style.height = h.toFixed(1) + 'px';
    });
    requestAnimationFrame(wave);
  }
  requestAnimationFrame(wave);

  function setOrb(m) { mode = m; orb.className = 'orb ' + m; }
  function show(el) {
    Object.values(L).forEach(x => {
      if (x === el) { x.classList.remove('out'); x.classList.add('show'); }
      else if (x.classList.contains('show')) { x.classList.remove('show'); x.classList.add('out'); }
    });
  }
  function hideAll() { Object.values(L).forEach(x => { x.classList.remove('show'); x.classList.add('out'); }); }
  function resetOut() { Object.values(L).forEach(x => x.classList.remove('out')); }

  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function run() {
    timers.splice(0).forEach(clearTimeout);
    resetOut();
    wEls.forEach(w => w.classList.remove('on', 'pending'));
    setOrb('idle'); level = 0;

    // 1. Driver speaks — live transcription
    at(400, () => { setOrb('listening'); level = 1; show(L.user); });
    const start = 700, step = 230;
    wEls.forEach((w, i) => {
      at(start + i * step, () => { w.classList.add('on', 'pending'); });
      at(start + i * step + 260, () => { w.classList.remove('pending'); });
    });
    const spokenEnd = start + wEls.length * step + 300;
    at(spokenEnd, () => { level = 0.15; });

    // 2. Thinking
    at(spokenEnd + 700, () => { setOrb('thinking'); show(L.think); });

    // 3. Reply
    const replyAt = spokenEnd + 2300;
    at(replyAt, () => { setOrb('speaking'); level = .85; show(L.reply); });

    // 4. Follow-up question
    const askAt = replyAt + 2600;
    at(askAt, () => { show(L.ask); level = .85; });
    at(askAt + 1800, () => { setOrb('listening'); level = .12; });

    // loop
    at(askAt + 5200, () => { hideAll(); setOrb('idle'); level = 0; });
    at(askAt + 6000, run);
  }
  run();
})();
</script>
</body>
</html>
