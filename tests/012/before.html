<div class="dp-root">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
.dp-root{width:512px;height:582px;box-sizing:border-box;padding:24px;background:#F4F5F7;font-family:'Inter',system-ui,sans-serif;color:#14161A;display:flex;flex-direction:column;gap:16px;-webkit-font-smoothing:antialiased;user-select:none}
.dp-root *{box-sizing:border-box}
.dp-display{height:70px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center}
.dp-number{grid-column:2;text-align:center;font-size:44px;font-weight:500;letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
.dp-del{grid-column:3;justify-self:end;width:56px;height:56px;border:0;border-radius:16px;background:transparent;color:#5B606B;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.dp-del:hover{background:#E6E8EC}
.dp-del:active{background:#DADDE3}
.dp-keys{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,80px);gap:12px}
.dp-key{border:0;border-radius:18px;background:#FFFFFF;box-shadow:0 1px 2px rgba(20,22,26,.06),0 0 0 1px rgba(20,22,26,.05);font-family:inherit;font-size:32px;font-weight:500;color:#14161A;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,transform .12s}
.dp-key:hover{background:#FAFBFC}
.dp-key:active{background:#ECEEF1;transform:scale(.98)}
.dp-key.sym{font-size:30px;color:#5B606B}
.dp-call{margin-top:4px;height:72px;border:0;border-radius:36px;background:#1FA855;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(31,168,85,.28);transition:background .15s,transform .12s}
.dp-call:hover{background:#1C9A4E}
.dp-call:active{background:#188744;transform:scale(.99)}
</style>
<div class="dp-display">
  <div class="dp-number" aria-live="polite">186</div>
  <button class="dp-del" aria-label="Delete">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg>
  </button>
</div>
<div class="dp-keys">
  <button class="dp-key">1</button><button class="dp-key">2</button><button class="dp-key">3</button>
  <button class="dp-key">4</button><button class="dp-key">5</button><button class="dp-key">6</button>
  <button class="dp-key">7</button><button class="dp-key">8</button><button class="dp-key">9</button>
  <button class="dp-key sym">*</button><button class="dp-key">0</button><button class="dp-key sym">#</button>
</div>
<button class="dp-call" aria-label="Call">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
</button>
</div>
