<div class="lk-card">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
.lk-card{box-sizing:border-box;width:772px;height:520px;padding:28px 32px;background:#FFFFFF;border-radius:24px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);border:1px solid #E6E8EC;font-family:'Inter',system-ui,sans-serif;color:#0F172A;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.lk-card *{box-sizing:border-box;margin:0}
.lk-child{padding-bottom:24px;border-bottom:1px solid #EDEFF2}
.lk-label{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:28px}
.lk-seg{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;height:64px;background:#F1F3F6;border-radius:16px}
.lk-seg span{display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:18px;font-weight:500;color:#5B6472}
.lk-seg span.on{background:#FFFFFF;color:#0F172A;font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08),0 2px 6px rgba(16,24,40,.08)}
.lk-rows{flex:1;display:flex;flex-direction:column}
.lk-row{flex:1;display:flex;align-items:center;justify-content:space-between;gap:24px}
.lk-row+.lk-row{border-top:1px solid #EDEFF2}
.lk-sub{margin-top:4px;font-size:16px;line-height:22px;color:#6B7280}
.lk-sw{flex:none;position:relative;width:64px;height:36px;border-radius:18px;background:#D5D9E0}
.lk-sw::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(16,24,40,.2)}
.lk-sw.on{background:#1F6FEB}
.lk-sw.on::after{left:31px}
</style>
  <div class="lk-child">
    <p class="lk-label">Child lock</p>
    <div class="lk-seg" role="radiogroup" aria-label="Child lock">
      <span role="radio" aria-checked="false">Off</span>
      <span role="radio" aria-checked="false">Left</span>
      <span role="radio" aria-checked="false">Right</span>
      <span role="radio" aria-checked="true" class="on">Both</span>
    </div>
  </div>
  <div class="lk-rows">
    <div class="lk-row">
      <div><p class="lk-label">Window lock</p><p class="lk-sub">Disable rear window switches</p></div>
      <span class="lk-sw" role="switch" aria-checked="false" aria-label="Window lock"></span>
    </div>
    <div class="lk-row">
      <div><p class="lk-label">Walk-away lock</p><p class="lk-sub">Lock when your phone key leaves</p></div>
      <span class="lk-sw on" role="switch" aria-checked="true" aria-label="Walk-away lock"></span>
    </div>
    <div class="lk-row">
      <div><p class="lk-label">Unlock on park</p><p class="lk-sub">Unlock all doors in Park</p></div>
      <span class="lk-sw on" role="switch" aria-checked="true" aria-label="Unlock on park"></span>
    </div>
  </div>
</div>
